        ctx.font = 'bold 12px Segoe UI';
        ctx.textBaseline = 'middle';
        ctx.fillText(secretFlashText, tLeft + tIcon + 12 + coinOx + 70, tTop + tBarH / 2 + coinOy);
        ctx.textBaseline = 'alphabetic';
      }

      // Кристаллы — справа от монет, тот же формат
      const cryX = tLeft + coinPanelW + 10 + coinOx;
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      roundRect(cryX, tTop + coinOy, 118, tBarH, 8);
      ctx.fill();
      if (isImageReady(crystalImg)) {
        drawSprite(crystalImg, cryX + 6 + tIcon / 2, tTop + tBarH / 2 + coinOy, tIcon, tIcon);
      } else {
        ctx.fillStyle = '#7FDBFF';
        ctx.beginPath();
        ctx.moveTo(cryX + 20, tTop + 12 + coinOy);
        ctx.lineTo(cryX + 32, tTop + 24 + coinOy);
        ctx.lineTo(cryX + 20, tTop + 36 + coinOy);
        ctx.lineTo(cryX + 8, tTop + 24 + coinOy);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#B2EBF2';
      ctx.font = 'bold 16px Segoe UI, Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('× ' + totalCrystals, cryX + tIcon + 12, tTop + tBarH / 2 + coinOy);
      ctx.textBaseline = 'alphabetic';

      // Подпись — выше
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '16px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Выбери персонажа', WIDTH / 2, 192);

      // --- 6 персонажей (2×3) ---
      const positions = getCharPositions();
      const colors = ['#FFEB3B', '#4FC3F7', '#FF8A65', '#CE93D8', '#80CBC4', '#FFD54F'];
      titleLayout._buyBtns = [];
      titleInfoBtns = [];

      for (let i = 0; i < 6; i++) {
        const shakeT = charShake[i] || 0;
        const sx = shakeT > 0 ? Math.sin(shakeT * 2.5) * 5 : 0;
        const sy = shakeT > 0 ? Math.cos(shakeT * 3.1) * 3 : 0;
        const baseX = positions[i].x;
        const baseY = positions[i].y;
        const size = titleLayout.charSize;
        const unlocked = isCharUnlocked(i);
        const isSelected = selectedCharacter === i && unlocked;
        const info = CHAR_INFO[i];
        // Плавное увеличение выбранной рамки
        const targetScale = isSelected ? 1.18 : 1;
        charSelectScale[i] += (targetScale - charSelectScale[i]) * 0.14;
        const sc = charSelectScale[i];

        const pad = 8;
        const cardW = size + pad * 2;
        const cardH = size + pad * 2;
        const radius = 16;
        const cx0 = baseX + size / 2 + sx;
        const cy0 = baseY + size / 2 + sy;
        const x = cx0 - size / 2;
        const y = cy0 - size / 2;
        const cardX = x - pad;
        const cardY = y - pad;

        ctx.save();
        ctx.translate(cx0, cy0);
        ctx.scale(sc, sc);
        ctx.translate(-cx0, -cy0);

        // Подложка / frame.png
        if (isImageReady(frameImg)) {
          const fx = cardX - 4;
          const fy = cardY - 4;
          const fw = cardW + 8;
          const fh = cardH + 8;
          ctx.drawImage(frameImg, fx, fy, fw, fh);
        } else {
          ctx.fillStyle = 'rgba(60, 65, 80, 0.45)';
          roundRect(cardX, cardY, cardW, cardH, radius);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.12)';
          ctx.lineWidth = 1.5;
          roundRect(cardX + 1, cardY + 1, cardW - 2, cardH - 2, radius - 1);
          ctx.stroke();
        }

        const img = playerImgs[i];
        if (isImageReady(img)) {
          const aspect = img.naturalWidth / img.naturalHeight;
          let dw = size;
          let dh = size / aspect;
          if (dh > size) { dh = size; dw = size * aspect; }
          ctx.drawImage(img, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
        }

        // Кнопка «!» — внутри рамки, правый верхний угол
        const infoR = 10;
        const infoCx = cardX + cardW - infoR - 6;
        const infoCy = cardY + infoR + 6;
        ctx.fillStyle = 'rgba(255, 200, 60, 0.95)';
        ctx.beginPath();
        ctx.arc(infoCx, infoCy, infoR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#1a1a2e';
        ctx.font = 'bold 13px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', infoCx, infoCy + 1);
        ctx.textBaseline = 'alphabetic';
        titleInfoBtns.push({ i, x: infoCx - infoR - 3, y: infoCy - infoR - 3, w: infoR * 2 + 6, h: infoR * 2 + 6 });

        if (!unlocked) {
          ctx.fillStyle = shakeT > 0 ? 'rgba(120,0,0,0.5)' : 'rgba(0,0,0,0.45)';
          roundRect(cardX, cardY, cardW, cardH, radius);
          ctx.fill();
          // close.png по центру, в 2 раза меньше рамки
          if (isImageReady(closeImg)) {
            const cs = Math.floor(size / 2);
            ctx.drawImage(closeImg, x + (size - cs) / 2, y + (size - cs) / 2, cs, cs);
          } else {
            ctx.fillStyle = shakeT > 0 ? '#ff8a80' : 'rgba(255,255,255,0.85)';
            ctx.font = '22px Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔒', x + size / 2, y + size / 2 - 2);
            ctx.textBaseline = 'alphabetic';
          }
        }

        ctx.restore(); // конец scale выбранного персонажа

        // Имя над персонажем (без scale)
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(info.name, baseX + size / 2 + sx, cardY - 4 - (sc - 1) * cardH * 0.35);
        ctx.textBaseline = 'alphabetic';

        if (!unlocked) {
          // Покупка под персонажем — price.png как рамка
          const buyW = size + 10;
          const buyH = 28;
          const buyX = baseX - 5;
          const buyY = cardY + cardH + 6;

          if (info.unlock === 'coins') {
            const canAfford = totalCoins >= info.price;
            if (isImageReady(priceImg)) {
              ctx.save();
              if (!canAfford) ctx.globalAlpha = 0.55;
              ctx.drawImage(priceImg, buyX + sx, buyY + sy, buyW, buyH);
              ctx.restore();
            } else {
              ctx.fillStyle = canAfford ? 'rgba(78, 205, 196, 0.95)' : 'rgba(80,80,90,0.9)';
              roundRect(buyX + sx, buyY + sy, buyW, buyH, 8);
              ctx.fill();
            }
            if (isImageReady(goldImg)) {
              ctx.drawImage(goldImg, buyX + 16 + sx, buyY + 5 + sy, 18, 18);
            }
            ctx.fillStyle = canAfford ? '#fff' : '#bbb';
            ctx.font = 'bold 11px Segoe UI';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            const priceStr = info.price >= 1000 ? (info.price / 1000) + 'k' : String(info.price);
            ctx.fillText(priceStr, buyX + 36 + sx, buyY + buyH / 2 + sy);
            ctx.textBaseline = 'alphabetic';
            titleLayout._buyBtns.push({ i, x: buyX, y: buyY, w: buyW, h: buyH });
          }
        }
      }

      // --- 4 кнопки в ряд: Start | Level | Note | Setting ---
      const menuImgs = [startBtnImg, levelImg, noteImg, settingImg];
      const menuKeys = ['start', 'levels', 'missions', 'settings'];
      const btnSize = 64;
      const btnGap = 12;
      const rowW = 4 * btnSize + 3 * btnGap;
      const rowX = (WIDTH - rowW) / 2;
      const rowY = titleLayout.startBtnY;
      titleLayout._menuBtns = [];
      for (let i = 0; i < 4; i++) {
        const bx = rowX + i * (btnSize + btnGap);
        const by = rowY;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        roundRect(bx, by, btnSize, btnSize, 12);
        ctx.fill();
        const img = menuImgs[i];
        if (isImageReady(img)) {
          drawSprite(img, bx + btnSize / 2, by + btnSize / 2, btnSize - 10, btnSize - 10);
        } else {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px Segoe UI';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(menuKeys[i].slice(0, 5).toUpperCase(), bx + btnSize / 2, by + btnSize / 2);
          ctx.textBaseline = 'alphabetic';
        }
        titleLayout._menuBtns.push({ key: menuKeys[i], x: bx, y: by, w: btnSize, h: btnSize });
      }
      // совместимость со старым кликом Start
      titleLayout._btnX = titleLayout._menuBtns[0].x;
      titleLayout._btnY = titleLayout._menuBtns[0].y;
      titleLayout._btnW = btnSize;
      titleLayout._btnH = btnSize;

      // Кнопка музыки на титуле
      drawHUDButtons();

      // Панели Level / Missions / Settings
      if (titleMenu) drawTitleMenuPanel();

      // Окно полного описания способностей
      if (charInfoPopup >= 0 && charInfoPopup < CHAR_INFO.length) {
        const info = CHAR_INFO[charInfoPopup];
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const pw = Math.min(320, WIDTH - 40);
        const ph = 210;
        const px = (WIDTH - pw) / 2;
        const py = (HEIGHT - ph) / 2 - 20;
        ctx.fillStyle = 'rgba(26, 28, 46, 0.97)';
        roundRect(px, py, pw, ph, 18);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1.5;
        roundRect(px, py, pw, ph, 18);
        ctx.stroke();

        // Аватар
        const av = 56;
        const img = playerImgs[charInfoPopup];
        if (isImageReady(img)) {
          const aspect = img.naturalWidth / img.naturalHeight;
          let dw = av, dh = av / aspect;
          if (dh > av) { dh = av; dw = av * aspect; }
          ctx.drawImage(img, px + 20 + (av - dw) / 2, py + 18 + (av - dh) / 2, dw, dh);
        }

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Segoe UI, Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(info.name, px + 20 + av + 14, py + 30);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '12px Segoe UI, Arial';
        ctx.fillText(info.label, px + 20 + av + 14, py + 52);
        ctx.textBaseline = 'alphabetic';

        // Описание
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = '14px Segoe UI, Arial';
        const lines = wrapText(info.desc, pw - 40);
        let ty = py + 90;
        for (const line of lines) {
          ctx.fillText(line, px + 20, ty);
          ty += 20;
        }

        // Кнопка закрыть
        const cx = px + pw - 28;
        const cy = py + 22;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(cx, cy, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('×', cx, cy + 1);
        ctx.textBaseline = 'alphabetic';
        titleLayout._infoClose = { x: cx - 16, y: cy - 16, w: 32, h: 32 };
        titleLayout._infoPanel = { x: px, y: py, w: pw, h: ph };
      } else {
        titleLayout._infoClose = null;
        titleLayout._infoPanel = null;
      }
    }

    function wrapText(text, maxW) {
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) {
          lines.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawTitleMenuPanel() {
      // Все меню — во весь экран, фон background.png
      const pw = WIDTH;
      const ph = HEIGHT;
      const px = 0;
      const py = 0;
      if (isImageReady(bgImg)) {
        ctx.drawImage(bgImg, 0, 0, WIDTH, HEIGHT);
      } else {
        ctx.fillStyle = 'rgba(22, 24, 40, 1)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }
      // Лёгкое затемнение для читаемости UI
      ctx.fillStyle = 'rgba(8, 10, 24, 0.35)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const titles = { levels: 'Уровни', missions: 'Задания', settings: 'Настройки' };
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(titles[titleMenu] || '', WIDTH / 2, py + 36);

      // Закрыть
      const cx = pw - 28;
      const cy = 28;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Segoe UI';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('×', cx, cy + 1);
      ctx.textBaseline = 'alphabetic';
      titleLayout._menuClose = { x: cx - 16, y: cy - 16, w: 32, h: 32 };
      titleLayout._menuHits = [];

      if (titleMenu === 'levels') {
        // Все 100 уровней на одной странице, скролл свайпом
        const cols = 5;
        const cellS = 58;
        const cellW = cellS;
        const cellH = cellS;
        const gap = 8;
        const gridW = cols * cellW + (cols - 1) * gap;
        const gx0 = (WIDTH - gridW) / 2;
        const rows = Math.ceil(100 / cols);
        const contentH = rows * (cellH + gap);
        const viewTop = py + 56;
        const viewH = ph - 72;
        levelScrollMax = Math.max(0, contentH - viewH);
        levelScrollY = Math.max(0, Math.min(levelScrollMax, levelScrollY));

        // Инерция скролла
        if (!levelDrag && Math.abs(levelScrollV) > 0.05) {
          levelScrollY += levelScrollV;
          levelScrollV *= 0.92;
          if (levelScrollY < 0) { levelScrollY = 0; levelScrollV = 0; }
          if (levelScrollY > levelScrollMax) { levelScrollY = levelScrollMax; levelScrollV = 0; }
        }

        titleLayout._levelClip = { x: px + 4, y: viewTop, w: pw - 8, h: viewH };

        ctx.save();
        ctx.beginPath();
        ctx.rect(px + 4, viewTop, pw - 8, viewH);
        ctx.clip();

        for (let n = 1; n <= 100; n++) {
          const i = n - 1;
          const col = i % cols;
          const row = Math.floor(i / cols);
          const gx = gx0 + col * (cellW + gap);
          const gy2 = viewTop + row * (cellH + gap) - levelScrollY;
          if (gy2 + cellH < viewTop - 4 || gy2 > viewTop + viewH + 4) continue;

          const unlocked = isLevelUnlocked(n);
          const done = !!levelsCompleted[n];
          const bg = getLevelRangeImg(n);
          if (isImageReady(bg)) {
            ctx.save();
            if (!unlocked) ctx.globalAlpha = 0.35;
            else if (done) ctx.globalAlpha = 0.9;
            ctx.drawImage(bg, gx, gy2, cellW, cellH);
            ctx.restore();
          } else {
            ctx.fillStyle = done ? 'rgba(78,205,196,0.35)' : (unlocked ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.35)');
            roundRect(gx, gy2, cellW, cellH, 8);
            ctx.fill();
          }
          ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.35)';
          ctx.font = 'bold 20px Segoe UI, Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.55)';
          ctx.shadowBlur = 4;
          ctx.fillText(String(n), gx + cellW / 2, gy2 + cellH / 2);
          ctx.shadowBlur = 0;
          ctx.textBaseline = 'alphabetic';
          if (done && isImageReady(completeImg)) {
            const cs = Math.floor(cellS * 0.38);
            ctx.drawImage(completeImg, gx + cellW - cs - 2, gy2 + cellH - cs - 2, cs, cs);
          }
          if (!unlocked && isImageReady(closeImg)) {
            const cs = Math.floor(cellS / 2);
            ctx.drawImage(closeImg, gx + (cellW - cs) / 2, gy2 + (cellH - cs) / 2, cs, cs);
          }
          if (unlocked) titleLayout._menuHits.push({ type: 'level', n, x: gx, y: gy2, w: cellW, h: cellH });
        }
        ctx.restore();

        // Скроллбар
        if (levelScrollMax > 0) {
          const barH = Math.max(24, viewH * (viewH / contentH));
          const barY = viewTop + (viewH - barH) * (levelScrollY / levelScrollMax);
          ctx.fillStyle = 'rgba(255,255,255,0.2)';
          roundRect(px + pw - 10, barY, 4, barH, 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '11px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('свайп ↑↓', WIDTH / 2, py + ph - 14);
      }

      if (titleMenu === 'missions') {
        // Сортировка: готовые к забору → в процессе → выполненные
        const sorted = MISSIONS.map(m => {
          const done = !!missionsDone[m.id];
          const progress = getMissionProgress(m);
          const ready = !done && progress >= m.need;
          let order = 1;
          if (ready) order = 0;
          else if (done) order = 2;
          return { m, done, progress, ready, order };
        }).sort((a, b) => a.order - b.order || a.m.id - b.m.id);

        const perPage = 8;
        const start = missionPage * perPage;
        const end = Math.min(sorted.length, start + perPage);
        let my = py + 48;
        const rowH = 52;
        for (let i = start; i < end; i++) {
          const { m, done, progress, ready } = sorted[i];
          ctx.fillStyle = done ? 'rgba(78,205,196,0.18)' : (ready ? 'rgba(255,200,60,0.12)' : 'rgba(255,255,255,0.08)');
          roundRect(px + 10, my, pw - 20, rowH - 4, 10);
          ctx.fill();
          ctx.fillStyle = done ? 'rgba(255,255,255,0.55)' : '#fff';
          ctx.font = 'bold 12px Segoe UI';
          ctx.textAlign = 'left';
          // Обрезка длинного текста
          let title = m.id + '. ' + m.text;
          if (ctx.measureText(title).width > pw - 120) {
            while (title.length > 8 && ctx.measureText(title + '…').width > pw - 120) title = title.slice(0, -1);
            title += '…';
          }
          ctx.fillText(title, px + 20, my + 18);
          ctx.font = '11px Segoe UI';
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.fillText(Math.min(progress, m.need) + '/' + m.need + ' · ×' + m.reward, px + 20, my + 36);
          if (done) {
            ctx.fillStyle = '#4ecdc4';
            ctx.font = 'bold 11px Segoe UI';
            ctx.textAlign = 'right';
            ctx.fillText('✓', px + pw - 22, my + 28);
          } else if (ready) {
            ctx.fillStyle = 'rgba(255, 200, 60, 0.95)';
            roundRect(px + pw - 96, my + 12, 74, 26, 8);
            ctx.fill();
            ctx.fillStyle = '#1a1a2e';
            ctx.font = 'bold 11px Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Забрать', px + pw - 59, my + 25);
            ctx.textBaseline = 'alphabetic';
            titleLayout._menuHits.push({ type: 'claim', id: m.id, reward: m.reward, x: px + pw - 96, y: my + 12, w: 74, h: 26 });
          }
          my += rowH;
        }

        // Кнопка «Забрать все» внизу
        const claimable = sorted.filter(s => s.ready);
        const claimAllY = py + ph - 58;
        if (claimable.length > 0) {
          ctx.fillStyle = 'rgba(255, 200, 60, 0.95)';
          roundRect(px + 40, claimAllY, pw - 80, 34, 12);
          ctx.fill();
          ctx.fillStyle = '#1a1a2e';
          ctx.font = 'bold 14px Segoe UI';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const sum = claimable.reduce((s, c) => s + c.m.reward, 0);
          ctx.fillText('Забрать все (' + claimable.length + ') · ×' + sum, WIDTH / 2, claimAllY + 17);
          ctx.textBaseline = 'alphabetic';
          titleLayout._menuHits.push({ type: 'claimAll', x: px + 40, y: claimAllY, w: pw - 80, h: 34 });
        }

        const misPages = Math.ceil(sorted.length / perPage);
        ctx.font = 'bold 13px Segoe UI';
        ctx.fillStyle = missionPage > 0 ? '#4ecdc4' : '#555';
        ctx.textAlign = 'left';
        ctx.fillText('‹', px + 16, py + ph - 16);
        titleLayout._menuHits.push({ type: 'misPrev', x: px + 8, y: py + ph - 32, w: 40, h: 28 });
        ctx.fillStyle = missionPage < misPages - 1 ? '#4ecdc4' : '#555';
        ctx.textAlign = 'right';
        ctx.fillText('›', px + pw - 16, py + ph - 16);
        titleLayout._menuHits.push({ type: 'misNext', x: px + pw - 48, y: py + ph - 32, w: 40, h: 28 });
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.font = '11px Segoe UI';
        ctx.fillText((missionPage + 1) + '/' + misPages, WIDTH / 2, py + ph - 16);
      }

      if (titleMenu === 'settings') {
        // Музыка вкл
        let sy = py + 70;
        ctx.fillStyle = '#fff';
        ctx.font = '15px Segoe UI';
        ctx.textAlign = 'left';
        ctx.fillText('Музыка', px + 28, sy);
        drawToggle(px + pw - 70, sy - 12, musicEnabled);
        titleLayout._menuHits.push({ type: 'togMusic', x: px + pw - 80, y: sy - 18, w: 50, h: 28 });

        sy += 50;
        ctx.fillText('Громкость музыки', px + 28, sy);
        drawSlider(px + 28, sy + 14, pw - 56, musicVol);
        titleLayout._menuHits.push({ type: 'slMusic', x: px + 28, y: sy + 6, w: pw - 56, h: 28 });

        sy += 60;
        ctx.fillText('Громкость эффектов', px + 28, sy);
        drawSlider(px + 28, sy + 14, pw - 56, sfxVol);
        titleLayout._menuHits.push({ type: 'slSfx', x: px + 28, y: sy + 6, w: pw - 56, h: 28 });

        sy += 55;
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '12px Segoe UI';
        ctx.fillText('Коды: monstergold · monsterall · monsterdell · openall', px + 28, sy);
      }
    }

    function drawToggle(x, y, on) {
      ctx.fillStyle = on ? '#4ecdc4' : 'rgba(255,255,255,0.2)';
      roundRect(x, y, 40, 22, 11);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(on ? x + 28 : x + 12, y + 11, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSlider(x, y, w, val) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      roundRect(x, y + 6, w, 8, 4);
      ctx.fill();
      ctx.fillStyle = '#4ecdc4';
      roundRect(x, y + 6, w * Math.max(0, Math.min(1, val)), 8, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + w * Math.max(0, Math.min(1, val)), y + 10, 9, 0, Math.PI * 2);
      ctx.fill();
    }

    // Лучший runCoins за забег (для миссий)
    let bestRunCoins = 0;
    try { bestRunCoins = parseInt(localStorage.getItem('monsterJumpBestRunCoins') || '0', 10) || 0; } catch (e) {}

    function getMissionProgress(m) {
      if (m.type === 'height') return bestScore;
      if (m.type === 'coins_total') return totalCoins;
      if (m.type === 'coins_run') return bestRunCoins;
      if (m.type === 'plays') return missionStats.plays || 0;
      if (m.type === 'use_bonus1') return missionStats.use_bonus1 || 0;
      if (m.type === 'use_bonus2') return missionStats.use_bonus2 || 0;
      if (m.type === 'use_bonus3') return missionStats.use_bonus3 || 0;
      if (m.type === 'level') {
        let c = 0;
        for (let i = 1; i <= 100; i++) if (levelsCompleted[i]) c++;
        return c;
      }
      return 0;
    }

    function drawLoadingScreen() {
      checkAssetsReady();
      const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      grad.addColorStop(0, '#1a1a2e');
      grad.addColorStop(1, '#0f3460');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      const progress = assetsTotal > 0 ? assetsLoaded / assetsTotal : 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Загрузка...', WIDTH / 2, HEIGHT / 2 - 30);

      const barW = 220;
      const barH = 12;
      const barX = (WIDTH - barW) / 2;
      const barY = HEIGHT / 2;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      roundRect(barX, barY, barW, barH, 6);
      ctx.fill();
      ctx.fillStyle = '#4ecdc4';
      roundRect(barX, barY, barW * progress, barH, 6);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '14px Segoe UI, Arial';
      ctx.fillText(Math.floor(progress * 100) + '%', WIDTH / 2, barY + 32);
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      if (gameState === 'loading') {
        drawLoadingScreen();
        return;
      }

      if (gameState === 'title') {
        drawTitleScreen();
        return;
      }

      // Игровой экран
      drawBackground();

      for (let p of platforms) {
        drawPlatform(p);
      }

      // Бонусы
      for (let b of bonuses) {
        drawBonus(b);
      }

      // Монеты
      for (let c of coins) {
        drawCoin(c);
      }

      // Звёздочки (под персонажем)
      drawParticles();

      drawPlayer();

      // Индикатор полёта — ниже рамки рекорда (topY 10 + h 48 + отступ)
      if (bonusActive) {
        const barW = 120;
        const barH = 10;
        const barX = (WIDTH - barW) / 2;
        const barY = 68;
        const progress = bonusTimer / BONUS_DURATION;

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        roundRect(barX - 2, barY - 2, barW + 4, barH + 4, 6);
        ctx.fill();

        ctx.fillStyle = '#FFD700';
        roundRect(barX, barY, barW * progress, barH, 4);
        ctx.fill();
      }

      // Счёт и рекорд
      drawScoreHUD();

      // Кнопки паузы и музыки (правый верхний угол)
      drawHUDButtons();

      // Оверлей паузы
      if (isPaused) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Панель
        const panelW = 260;
        const panelH = 200;
        const panelX = (WIDTH - panelW) / 2;
        const panelY = (HEIGHT - panelH) / 2 - 20;
        ctx.fillStyle = 'rgba(26, 26, 46, 0.95)';
        roundRect(panelX, panelY, panelW, panelH, 20);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1.5;
        roundRect(panelX, panelY, panelW, panelH, 20);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ПАУЗА', WIDTH / 2, panelY + 48);

        // Кнопка «Продолжить»
        const btnW = 200;
        const btnH = 44;
        const contX = (WIDTH - btnW) / 2;
        const contY = panelY + 80;
        ctx.fillStyle = '#4ecdc4';
        roundRect(contX, contY, btnW, btnH, 22);
        ctx.fill();
        ctx.fillStyle = '#1a1a2e';
        ctx.font = 'bold 18px Segoe UI, Arial';
        ctx.textBaseline = 'middle';
        ctx.fillText('Продолжить', WIDTH / 2, contY + btnH / 2);

        // Кнопка «Меню»
        const menuY = contY + btnH + 14;
        ctx.fillStyle = 'rgba(92, 107, 192, 0.95)';
        roundRect(contX, menuY, btnW, btnH, 22);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText('Меню', WIDTH / 2, menuY + btnH / 2);
        ctx.textBaseline = 'alphabetic';

        // Hitbox для кликов
        pauseMenuBtns.continue = { x: contX, y: contY, w: btnW, h: btnH };
        pauseMenuBtns.menu = { x: contX, y: menuY, w: btnW, h: btnH };
      }

      // Экран «Уровень пройден»
      if (gameState === 'levelwin') {
        drawLevelWinScreen();
      }

      // Эффект проигрыша — затемнение + красная вспышка (без текста)
      if (gameState === 'dying') {
        const t = 1 - dyingTimer / 90;
        if (t < 0.25) {
          ctx.fillStyle = `rgba(180, 30, 40, ${(0.25 - t) * 1.2})`;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }
        ctx.fillStyle = `rgba(10, 8, 20, ${t * 0.65})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      // Виньетка
      const vignette = ctx.createRadialGradient(WIDTH/2, HEIGHT/2, HEIGHT*0.3, WIDTH/2, HEIGHT/2, HEIGHT*0.9);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.15)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    function drawLevelWinScreen() {
      // Ease: плавное появление из центра / уход в центр
      const easeOutBack = (x) => {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      };
      const easeIn = (x) => x * x;
      let anim = levelWinAnimT;
      if (levelWinAnim === 'in') anim = easeOutBack(Math.min(1, levelWinAnimT));
      else if (levelWinAnim === 'out') anim = easeIn(levelWinAnimT);
      else anim = 1;
      const scale = Math.max(0.01, anim);
      const alpha = Math.max(0, Math.min(1, levelWinAnimT));

      // Затемнение фона
      ctx.fillStyle = `rgba(8, 12, 28, ${0.65 * alpha})`;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      // Золотая вспышка при появлении
      if (levelWinAnim === 'in' && levelWinAnimT < 0.5) {
        ctx.fillStyle = `rgba(255, 220, 80, ${(0.5 - levelWinAnimT) * 0.35})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      const panelW = 300;
      const panelH = 260;
      const panelX = (WIDTH - panelW) / 2;
      const panelY = (HEIGHT - panelH) / 2 - 20;

      ctx.save();
      ctx.translate(WIDTH / 2, HEIGHT / 2 - 10);
      ctx.scale(scale, scale);
      ctx.translate(-WIDTH / 2, -(HEIGHT / 2 - 10));
      ctx.globalAlpha = alpha;

      const pulse = levelWinAnim === 'idle' ? (0.5 + 0.5 * Math.sin(levelWinTimer * 0.12)) : 0.5;
      ctx.save();
      ctx.shadowColor = `rgba(78, 205, 196, ${0.35 + pulse * 0.35})`;
      ctx.shadowBlur = 20;
      ctx.fillStyle = 'rgba(26, 28, 50, 0.96)';
      roundRect(panelX, panelY, panelW, panelH, 22);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = `rgba(78, 205, 196, ${0.5 + pulse * 0.4})`;
      ctx.lineWidth = 2.5;
      roundRect(panelX, panelY, panelW, panelH, 22);
      ctx.stroke();

      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 26px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Уровень пройден!', WIDTH / 2, panelY + 48);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 40px Segoe UI, Arial';
      ctx.fillText(String(levelWinLevel), WIDTH / 2, panelY + 100);

      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '14px Segoe UI, Arial';
      ctx.fillText('+' + (50 + levelWinLevel) + ' монет · +5000 💎 · ' + score + ' m', WIDTH / 2, panelY + 130);

      // Кнопки Home | Next
      const btnS = 64;
      const gap = 28;
      const homeX = WIDTH / 2 - btnS - gap / 2;
      const nextX = WIDTH / 2 + gap / 2;
      const btnY = panelY + 160;

      function drawWinBtn(img, x, y, label) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        roundRect(x, y, btnS, btnS, 14);
        ctx.fill();
        if (isImageReady(img)) {
          drawSprite(img, x + btnS / 2, y + btnS / 2, btnS - 12, btnS - 12);
        } else {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px Segoe UI';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x + btnS / 2, y + btnS / 2);
          ctx.textBaseline = 'alphabetic';
        }
      }
      drawWinBtn(homeImg, homeX, btnY, 'HOME');
      drawWinBtn(nextImg, nextX, btnY, 'NEXT');

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '11px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Домой', homeX + btnS / 2, btnY + btnS + 16);
      ctx.fillText(levelWinLevel >= 100 ? 'Финиш' : 'Далее', nextX + btnS / 2, btnY + btnS + 16);

      ctx.restore(); // конец scale из центра

      // Hitbox только когда окно полностью открыто
      if (levelWinAnim === 'idle') {
        levelWinBtns.home = { x: homeX, y: btnY, w: btnS, h: btnS };
        levelWinBtns.next = { x: nextX, y: btnY, w: btnS, h: btnS };
      } else {
        levelWinBtns.home = null;
        levelWinBtns.next = null;
      }
    }

    function drawScoreHUD() {
      if (gameState !== 'playing') return;

      // Единая верхняя линия как у pause/sound (y=10, h=48)
      const topY = 10;
      const barH = 48;
      const leftX = 2;
      const iconSize = 30;

      // --- Слева: монеты (высота как у кнопок) ---
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      roundRect(leftX, topY, 118, barH, 8);
      ctx.fill();

      const totalIcon = isImageReady(allgoldImg) ? allgoldImg : goldImg;
      drawSprite(totalIcon, leftX + 6 + iconSize / 2, topY + barH / 2, iconSize, iconSize);

      ctx.fillStyle = '#FFE082';
      ctx.font = 'bold 16px Segoe UI, Arial';

      ctx.textBaseline = 'middle';
      ctx.fillText('× ' + totalCoins, leftX + iconSize + 12, topY + barH / 2);
      ctx.textBaseline = 'alphabetic';

      const scoreW = 150;

      ctx.fillStyle = 'rgba(0,0,0,0.28)';

      if (isImageReady(liderImg)) {
        drawSprite(liderImg, scoreX + 20, topY + 16, 20, 20);
      }
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Segoe UI, Arial';
      ctx.fillText(bestScore + ' m', scoreX + scoreW / 2 + 8, topY + 16);
      // Текущий счёт снизу в той же рамке
      ctx.fillStyle = 'rgba(255,255,255,0.75)';

      ctx.fillText(score + ' m', scoreX + scoreW / 2, topY + 34);
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';

      // --- Бонусы ниже верхней линии ---
      drawBonusShop(leftX, topY + barH + 10);
    }

    function drawBonusShop(anchorX, anchorY) {
      shopHit = { b1: null, buy1: null, b2: null, buy2: null, b3: null, buy3: null };

      const colX = 2;
      const cellW = 56;
      const cellH = 52;
      const buyW = 60;
      const buyH = 24;
      const iconBox = 40; // крупнее и чётче
      const gapY = 5;

      let y = anchorY;

      function drawBonusCell(which, img, count) {
        const cellX = colX;
        const cd = which === 1 ? cdBonus1 : (which === 2 ? cdBonus2 : cdBonus3);
        const busy = (which === 1 && bonusActive) || (which === 2 && extraLifeReady) || (which === 3 && jumpBoostTimer > 0);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        roundRect(cellX, y, cellW, cellH, 10);
        ctx.fill();

        const cx = cellX + cellW / 2;
        const cy = y + iconBox / 2 + 4;

        if (busy || cd > 0) ctx.globalAlpha = 0.4;
        drawSprite(img, cx, cy, iconBox, iconBox);
        ctx.globalAlpha = 1;

        if (cd > 0) {
          const progress = 1 - cd / ABILITY_COOLDOWN;
          const ringR = iconBox / 2 + 3;
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(0,0,0,0.45)';
          ctx.lineWidth = 3;
          ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.strokeStyle = which === 1 ? '#FFD700' : (which === 2 ? '#4FC3F7' : '#CE93D8');
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px Segoe UI';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(Math.ceil(cd / 60)), cx, cy);
          ctx.textBaseline = 'alphabetic';
        }

        // Количество в правом нижнем углу рамки
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText('×' + count, cellX + cellW - 5, y + cellH - 4);
        ctx.textBaseline = 'alphabetic';
        const useBox = { x: cellX, y: y, w: cellW, h: cellH };
        if (which === 1) shopHit.b1 = useBox;
        else if (which === 2) shopHit.b2 = useBox;
        else shopHit.b3 = useBox;
        y += cellH + 3;
      }

      function drawBuyCell(which, price) {
        const bx = colX;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        roundRect(bx, y, buyW, buyH, 8);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.35)';
        ctx.lineWidth = 1;
        roundRect(bx, y, buyW, buyH, 8);
        ctx.stroke();
        drawSprite(goldImg, bx + 11, y + buyH / 2, 14, 14);
        ctx.fillStyle = totalCoins >= price ? '#FFE082' : '#ff8a80';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('×' + price, bx + 20, y + buyH / 2);
        ctx.textBaseline = 'alphabetic';
        const buyBox = { x: bx, y: y, w: buyW, h: buyH };
        if (which === 1) shopHit.buy1 = buyBox;
        else if (which === 2) shopHit.buy2 = buyBox;
        else shopHit.buy3 = buyBox;
        y += buyH + gapY + 3;
      }

      drawBonusCell(1, bonusImg, invBonus1);
      drawBuyCell(1, BONUS1_PRICE);
      drawBonusCell(2, bonus2Img, invBonus2);
      drawBuyCell(2, BONUS2_PRICE);
      drawBonusCell(3, bonus3Img, invBonus3);
      drawBuyCell(3, BONUS3_PRICE);
    }

    function drawCoin(c) {
      if (c.collected) return;
      const screenY = c.y - cameraY + Math.sin(c.phase) * 3;
      if (screenY < -40 || screenY > HEIGHT + 40) return;

      const size = 32;
      const cx = c.x + c.width / 2;
      const cy = screenY + c.height / 2;
      drawSprite(goldImg, cx, cy, size, size, { shadow: 'rgba(255, 200, 0, 0.35)', blur: 6 });
    }

    function drawHUDButtons() {
      // --- Пауза (только в игре) — pause.png ---
      if (gameState === 'playing') {
        const { x, y, size } = pauseBtn;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        roundRect(x, y, size, size, 8);
        ctx.fill();
        if (isImageReady(pauseImg)) {
          drawSprite(pauseImg, x + size / 2, y + size / 2, size - 6, size - 6);
        }
        // Если на паузе — лёгкая подсветка
        if (isPaused) {
          ctx.strokeStyle = 'rgba(78, 205, 196, 0.7)';
          ctx.lineWidth = 2;
          roundRect(x, y, size, size, 8);
          ctx.stroke();
        }
      }

      // --- Звук (только в игре; на титуле скрыт) — sound.png ---
      if (gameState === 'playing') {
        const { x, y, size } = musicBtn;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        roundRect(x, y, size, size, 8);
        ctx.fill();
        if (isImageReady(soundImg)) {
          ctx.save();
          if (!musicEnabled) ctx.globalAlpha = 0.4;
          drawSprite(soundImg, x + size / 2, y + size / 2, size - 6, size - 6);
          ctx.restore();
        }
        if (!musicEnabled) {
          ctx.strokeStyle = '#ff6b6b';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x + 8, y + size - 8);
          ctx.lineTo(x + size - 8, y + 8);
          ctx.stroke();
        }
      }
    }

    // ---------- ОБРАБОТКА КЛИКОВ НА ТИТУЛЬНОМ ЭКРАНЕ ----------
    function handleTitleClick(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      const mx = (clientX - rect.left) * scaleX;
      const my = (clientY - rect.top) * scaleY;

      // На титуле музыка не играет

      // Меню levels/missions/settings
      if (titleMenu) {
        const cl = titleLayout._menuClose;
        if (cl && mx >= cl.x && mx <= cl.x + cl.w && my >= cl.y && my <= cl.y + cl.h) {
          titleMenu = null;
          return;
        }
        for (const h of (titleLayout._menuHits || [])) {
          if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
            if (h.type === 'level' && isLevelUnlocked(h.n)) {
              if (levelDidScroll) {
                levelDidScroll = false;
                return;
              }
              currentLevel = h.n;
              levelTarget = getLevelTarget(h.n);
              titleMenu = null;
              if (!unlockedChars[selectedCharacter]) selectedCharacter = 0;
              startGame();
              return;
            }
            if (h.type === 'misPrev' && missionPage > 0) missionPage--;
            if (h.type === 'misNext' && (missionPage + 1) * 8 < MISSIONS.length) missionPage++;
            if (h.type === 'claim' && !missionsDone[h.id]) {
              missionsDone[h.id] = true;
              totalCoins += h.reward;
              saveProgress();
              saveMetaProgress();
              secretFlashTimer = 60;
              secretFlashText = '+' + h.reward;
            }
            if (h.type === 'claimAll') {
              let sum = 0;
              let cnt = 0;
              for (const m of MISSIONS) {
                if (missionsDone[m.id]) continue;
                if (getMissionProgress(m) >= m.need) {
                  missionsDone[m.id] = true;
                  sum += m.reward;
                  cnt++;
                }
              }
              if (cnt > 0) {
                totalCoins += sum;
                saveProgress();
                saveMetaProgress();
                secretFlashTimer = 70;
                secretFlashText = '+' + sum;
                coinShake = 14;
              }
            }
            if (h.type === 'togMusic') {
              toggleMusic();
              saveMetaProgress();
            }
            if (h.type === 'slMusic') {
              musicVol = Math.max(0, Math.min(1, (mx - h.x) / h.w));
              music.volume = musicVol;
              saveMetaProgress();
            }
            if (h.type === 'slSfx') {
              sfxVol = Math.max(0, Math.min(1, (mx - h.x) / h.w));
              saveMetaProgress();
            }
            return;
          }
        }
        return;
      }

      // Окно описания: закрытие
      if (charInfoPopup >= 0) {
        const cl = titleLayout._infoClose;
        const panel = titleLayout._infoPanel;
        if (cl && mx >= cl.x && mx <= cl.x + cl.w && my >= cl.y && my <= cl.y + cl.h) {
          charInfoPopup = -1;
          return;
        }
        if (panel && !(mx >= panel.x && mx <= panel.x + panel.w && my >= panel.y && my <= panel.y + panel.h)) {
          charInfoPopup = -1;
          return;
        }
        return;
      }

      // 4 кнопки меню
      if (titleLayout._menuBtns) {
        for (const b of titleLayout._menuBtns) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            if (b.key === 'start') {
              currentLevel = 0;
              levelTarget = 0;
              if (!unlockedChars[selectedCharacter]) selectedCharacter = 0;
              startGame();
            } else if (b.key === 'levels') {
              titleMenu = 'levels';
              levelScrollY = 0;
              levelScrollV = 0;
            } else if (b.key === 'missions') {
              titleMenu = 'missions';
            } else if (b.key === 'settings') {
              titleMenu = 'settings';
            }
            return;
          }
        }
      }

      // Кнопки «!» у персонажей
      for (const b of titleInfoBtns) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          charInfoPopup = b.i;
          return;
        }
      }

      // Кнопка купить (только coin-unlock)
      if (titleLayout._buyBtns) {
        for (const b of titleLayout._buyBtns) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            const info = CHAR_INFO[b.i];
            if (!isCharUnlocked(b.i) && info.unlock === 'coins') {
              if (totalCoins >= info.price) {
                totalCoins -= info.price;
                unlockedChars[b.i] = true;
                selectedCharacter = b.i;
                saveProgress();
              } else {
                triggerNoMoneyShake(b.i);
              }
            }
            return;
          }
        }
      }

      // Клик по персонажам (только открытых)
      const positions = getCharPositions();
      for (let i = 0; i < 6; i++) {
        const x = positions[i].x;
        const y = positions[i].y;
        const size = titleLayout.charSize;
        if (mx >= x - 8 && mx <= x + size + 8 && my >= y - 8 && my <= y + size + 8) {
          // 25 нажатий: 1-й → все персонажи, 2-й → все уровни, 3-й → сброс
          if (i === 0) {
            firstCharTapCount++;
            secondCharTapCount = 0;
            thirdCharTapCount = 0;
            fourthCharTapCount = 0;
            if (firstCharTapCount >= 25) {
              for (let j = 0; j < 6; j++) unlockedChars[j] = true;
              saveProgress();
              firstCharTapCount = 0;
              secretFlashTimer = 90;
              secretFlashText = 'ALL';
              coinShake = 18;
            }
          } else if (i === 1) {
            secondCharTapCount++;
            firstCharTapCount = 0;
            thirdCharTapCount = 0;
            fourthCharTapCount = 0;
            if (secondCharTapCount >= 25) {
              maxLevelUnlocked = 100;
              saveMetaProgress();
              secondCharTapCount = 0;
              secretFlashTimer = 90;
              secretFlashText = 'LV100';
              coinShake = 18;
            }
          } else if (i === 2) {
            thirdCharTapCount++;
            firstCharTapCount = 0;
            secondCharTapCount = 0;
            fourthCharTapCount = 0;
            if (thirdCharTapCount >= 25) {
              totalCoins = 0;
              totalCrystals = 0;
              unlockedChars = [true, false, false, false, false, false];
              invBonus1 = 0;
              invBonus2 = 0;
              invBonus3 = 0;
              bestScore = 0;
              selectedCharacter = 0;
              maxLevelUnlocked = 1;
              levelsCompleted = {};
              missionsDone = {};
              missionStats = { plays: 0, use_bonus1: 0, use_bonus2: 0, use_bonus3: 0 };
              bestRunCoins = 0;
              saveProgress();
              saveMetaProgress();
              try { localStorage.setItem('monsterJumpBestRunCoins', '0'); } catch (e) {}
              thirdCharTapCount = 0;
              secretFlashTimer = 90;
              secretFlashText = 'DEL';
              coinShake = 18;
            }
          } else if (i === 3) {
            fourthCharTapCount++;
            firstCharTapCount = 0;
            secondCharTapCount = 0;
            thirdCharTapCount = 0;
            if (fourthCharTapCount >= 25) {
              totalCoins += 1000000;
              saveProgress();
              fourthCharTapCount = 0;
              secretFlashTimer = 90;
              secretFlashText = '+1M';
              coinShake = 18;
            }
          } else {
            firstCharTapCount = 0;
            secondCharTapCount = 0;
            thirdCharTapCount = 0;
            fourthCharTapCount = 0;
          }
          if (isCharUnlocked(i)) selectedCharacter = i;
          else if (CHAR_INFO[i].unlock === 'coins') triggerNoMoneyShake(i);
          return;
        }
      }

      }

    function handleGameClick(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      const mx = (clientX - rect.left) * scaleX;
      const my = (clientY - rect.top) * scaleY;

      // Меню победы на уровне — плавное закрытие, затем действие
      if (gameState === 'levelwin') {
        if (levelWinAnim !== 'idle') return;
        const h = levelWinBtns.home;
        const n = levelWinBtns.next;
        if (h && mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
          levelWinPending = 'home';
          levelWinAnim = 'out';
          return;
        }
        if (n && mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
          levelWinPending = 'next';
          levelWinAnim = 'out';
          return;
        }
        return;
      }

      if (gameState === 'playing') {
        // Магазин бонусов
        if (!isPaused) {
          const hit = (box) => box && mx >= box.x && mx <= box.x + box.w && my >= box.y && my <= box.y + box.h;
          if (hit(shopHit.buy1)) { buyBonus(1); return; }
          if (hit(shopHit.buy2)) { buyBonus(2); return; }
          if (hit(shopHit.buy3)) { buyBonus(3); return; }
          if (hit(shopHit.b1)) { useBonus1(); return; }
          if (hit(shopHit.b2)) { useBonus2(); return; }
          if (hit(shopHit.b3)) { useBonus3(); return; }
        }

        // Кнопки на экране паузы
        if (isPaused) {
          const c = pauseMenuBtns.continue;
          const m = pauseMenuBtns.menu;
          if (c && mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) {
            isPaused = false;
            keys.left = false;
            keys.right = false;
            return;
          }
          if (m && mx >= m.x && mx <= m.x + m.w && my >= m.y && my <= m.y + m.h) {
            isPaused = false;
            goToMenu();
            return;
          }
          return; // клик по оверлею — ничего
        }

        // Кнопка паузы
        {
          const { x, y, size } = pauseBtn;
          if (mx >= x && mx <= x + size && my >= y && my <= y + size) {
            isPaused = !isPaused;
            keys.left = false;
            keys.right = false;
            return;
          }
        }
        // Кнопка музыки
        {
          const { x, y, size } = musicBtn;
          if (mx >= x && mx <= x + size && my >= y && my <= y + size) {
            toggleMusic();
            return;
          }
        }
      }
    }

    canvas.addEventListener('click', e => {
      if (gameState === 'title') {
        handleTitleClick(e.clientX, e.clientY);
      } else if (gameState === 'playing' || gameState === 'levelwin') {
        handleGameClick(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length === 0) return;
      const t = e.changedTouches[0];
      if (gameState === 'title') {
        e.preventDefault();
        handleTitleClick(t.clientX, t.clientY);
      } else if (gameState === 'playing' || gameState === 'levelwin') {
        handleGameClick(t.clientX, t.clientY);
      }
    }, { passive: false });

    // Клавиша P / Escape — пауза
    window.addEventListener('keydown', e => {
      if ((e.code === 'KeyP' || e.code === 'Escape') && gameState === 'playing') {
        isPaused = !isPaused;
        keys.left = false;
        keys.right = false;
      }
    });

    // ---------- ГЛАВНЫЙ ЦИКЛ (фиксированный шаг 90 FPS) ----------
    // Одинаковая скорость на любом экране (60/90/120 Гц)
    const TARGET_FPS = 90;
    const FIXED_DT = 1000 / TARGET_FPS;
    let lastFrameTime = 0;
    let accumulator = 0;

    function loop(now) {
      if (!lastFrameTime) lastFrameTime = now;
      let frameTime = now - lastFrameTime;
      lastFrameTime = now;
      // Защита от долгих пауз / переключений вкладки
      if (frameTime > 45) frameTime = 45;
      accumulator += frameTime;

      while (accumulator >= FIXED_DT) {
        if (gameState === 'playing' || gameState === 'dying' || gameState === 'levelwin') {
          update();
        }
        accumulator -= FIXED_DT;
      }

      draw();
      requestAnimationFrame(loop);
    }

    // Старт с титульного экрана
    requestAnimationFrame(loop);
  </script>
</body>
</html>
