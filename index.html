<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Doodle Jump Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
      max-width: 100%;
      max-height: 100%;
      /* Мягкое сглаживание — без шума и пикселизации */
      image-rendering: auto;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #score {
      margin-top: 20px;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      background: rgba(0,0,0,0.25);
      padding: 8px 22px;
      border-radius: 20px;
      display: none; /* скрыт на титульном экране */
    }
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #game-over h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #ff6b6b;
    }
    #game-over p {
      font-size: 20px;
      margin-bottom: 25px;
      opacity: 0.9;
    }
    #restart-btn {
      background: #4ecdc4;
      border: none;
      color: #1a1a2e;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    #restart-btn:hover {
      background: #45b7aa;
      transform: scale(1.05);
    }
    #hint {
      position: absolute;
      bottom: 30px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <div id="score">0</div>
      <div id="game-over">
        <h1>Игра окончена</h1>
        <p>Счёт: <span id="final-score">0</span></p>
        <button id="restart-btn">Играть снова</button>
      </div>
      <div id="hint">← → или A D · на телефоне свайп</div>
    </div>
  </div>

  <script>
    // =====================================================
    //  DOODLE JUMP CLONE — полностью рабочая версия
    //  Замени ассеты в разделе ASSETS ниже
    // =====================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const hintEl = document.getElementById('hint');

    // ---------- НАСТРОЙКИ ----------
    const WIDTH = 400;
    const HEIGHT = 700;
    const GRAVITY = 0.35;
    const JUMP_FORCE = -13.5;
    const MOVE_SPEED = 6.2;
    const PLATFORM_WIDTH = 70;
    const PLATFORM_HEIGHT = 16;
    const PLAYER_WIDTH = 40;
    const PLAYER_HEIGHT = 50;

    // =====================================================
    //  СПРАЙТЫ (ASSETS)
    // =====================================================
    // Игра автоматически пытается загрузить картинки из папки assets/
    // Если файла нет или он не загрузился — используется стандартная отрисовка.
    //
    // Список всех спрайтов:
    //
    //   assets/titlename.png           — название "Monster Jump"
    //   assets/start.png               — кнопка Старт
    //   assets/player.png              — персонаж 1
    //   assets/player2.png             — персонаж 2
    //   assets/player3.png             — персонаж 3
    //   assets/platform.png            — обычная платформа
    //   assets/platform_broken.png     — ломающаяся платформа
    //   assets/platform_moving.png     — двигающаяся платформа
    //   assets/spring.png              — пружина
    //   assets/bonus.png               — бонус (увеличивает персонажа)
    //   assets/background.png          — фон
    //   assets/music.mp3               — фоновая музыка
    // =====================================================

    const ASSETS = {
      titleName:       'assets/titlename.png',
      startBtn:        'assets/start.png',
      player:          'assets/player.png',
      player2:         'assets/player2.png',
      player3:         'assets/player3.png',
      platform:        'assets/platform.png',
      platformBroken:  'assets/platform_broken.png',
      platformMoving:  'assets/platform_moving.png',
      spring:          'assets/spring.png',
      bonus:           'assets/bonus.png',
      background:      'assets/background.png',
      music:           'assets/music.mp3'
    };

    let titleNameImg = null;
    let startBtnImg = null;
    let playerImgs = [null, null, null]; // 3 персонажа
    let platformImg = null;
    let brokenPlatformImg = null;
    let movingPlatformImg = null;
    let springImg = null;
    let bonusImg = null;
    let bgImg = null;

    // Текущий выбранный персонаж (0, 1 или 2)
    let selectedCharacter = 0;
    let currentPlayerImg = null; // будет установлен при старте

    function loadImage(src) {
      const img = new Image();
      // Важно для GitHub Pages: путь чувствителен к регистру
      img.src = src;
      img.onerror = () => {
        console.warn('Не удалось загрузить:', src);
      };
      return img;
    }

    // Пробуем несколько вариантов имени файла (для GitHub, где регистр важен)
    function loadImageWithFallback(paths) {
      const img = new Image();
      let index = 0;
      function tryNext() {
        if (index >= paths.length) {
          console.warn('Бонус не найден. Проверь имя файла: assets/bonus.png');
          return;
        }
        img.src = paths[index++];
      }
      img.onerror = tryNext;
      tryNext();
      return img;
    }

    titleNameImg      = loadImage(ASSETS.titleName);
    startBtnImg       = loadImage(ASSETS.startBtn);
    playerImgs[0]     = loadImage(ASSETS.player);
    playerImgs[1]     = loadImage(ASSETS.player2);
    playerImgs[2]     = loadImage(ASSETS.player3);
    platformImg       = loadImage(ASSETS.platform);
    brokenPlatformImg = loadImage(ASSETS.platformBroken);
    movingPlatformImg = loadImage(ASSETS.platformMoving);
    springImg         = loadImage(ASSETS.spring);
    // Бонус: пробуем разные варианты имени (частая проблема на GitHub)
    bonusImg          = loadImageWithFallback([
      'assets/bonus.png',
      'assets/Bonus.png',
      'assets/BONUS.png',
      'assets/bonus.PNG',
      'assets/bonus.jpg',
      'assets/Bonus.jpg'
    ]);
    bgImg             = loadImage(ASSETS.background);

    function isImageReady(img) {
      return img && img.complete && img.naturalWidth > 0;
    }

    // ---------- СОСТОЯНИЕ ИГРЫ ----------
    let player = {
      x: WIDTH / 2 - PLAYER_WIDTH / 2,
      y: HEIGHT - 150,
      vx: 0,
      vy: 0,
      width: PLAYER_WIDTH,
      height: PLAYER_HEIGHT,
      facing: 1
    };

    let platforms = [];
    let bonuses = [];          // бонусы в мире
    let cameraY = 0;
    let maxHeight = 0;
    let score = 0;
    let gameState = 'title'; // 'title' | 'playing' | 'gameover'
    let keys = { left: false, right: false };
    let touchX = null;

    // Бонус-эффект
    let bonusActive = false;
    let bonusTimer = 0;        // оставшееся время в кадрах (~60fps * 5 = 300)
    const BONUS_DURATION = 300; // 5 секунд
    const BONUS_SCALE = 4;
    const BONUS_FLY_FORCE = -11; // постоянная сила вверх во время бонуса

    // Частицы (звёздочки) при бонусе
    let particles = [];

    // Пауза
    let isPaused = false;

    // ---------- МУЗЫКА ----------
    let musicEnabled = true;
    let musicStarted = false;
    const music = new Audio(ASSETS.music);
    music.loop = true;
    music.volume = 0.35; // тише, чтобы были слышны звуки прыжков
    music.preload = 'auto';

    function startMusic() {
      if (!musicEnabled) return;
      music.play().then(() => {
        musicStarted = true;
      }).catch(() => {
        // Браузер может заблокировать автозапуск — запустим при следующем клике
      });
    }

    function stopMusic() {
      music.pause();
      music.currentTime = 0;
      musicStarted = false;
    }

    function toggleMusic() {
      musicEnabled = !musicEnabled;
      if (musicEnabled) {
        startMusic();
      } else {
        music.pause();
      }
    }

    // ---------- ЗВУК (Web Audio API) ----------
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Звук обычного прыжка
    function playJumpSound() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.06);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.18);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.28, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    // Звук пружины (более высокий и длинный)
    function playSpringSound() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(350, now + 0.25);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.32, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.start(now);
        osc.stop(now + 0.32);
      } catch (e) {}
    }

    // Звук подбора бонуса
    function playBonusSound() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        // Два тона вверх
        [0, 0.08, 0.16].forEach((delay, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.type = 'sine';
          const freq = 400 + i * 180;
          osc.frequency.setValueAtTime(freq, now + delay);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.3, now + delay + 0.1);

          gain.gain.setValueAtTime(0.001, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.22, now + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.15);

          osc.start(now + delay);
          osc.stop(now + delay + 0.18);
        });
      } catch (e) {}
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function resize() {
      const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
      canvas.width = WIDTH;
      canvas.height = HEIGHT;
      canvas.style.width = Math.floor(WIDTH * scale) + 'px';
      canvas.style.height = Math.floor(HEIGHT * scale) + 'px';

      // Мягкое сглаживание — спрайты выглядят чисто и гармонично
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- ГЕНЕРАЦИЯ ПЛАТФОРМ ----------
    function createPlatform(y, type = null) {
      const types = ['normal', 'normal', 'normal', 'moving', 'breaking', 'spring'];
      const t = type || types[Math.floor(Math.random() * types.length)];

      return {
        x: Math.random() * (WIDTH - PLATFORM_WIDTH),
        y: y,
        width: PLATFORM_WIDTH,
        height: PLATFORM_HEIGHT,
        type: t,
        // для двигающихся
        dir: Math.random() > 0.5 ? 1 : -1,
        speed: 1.5 + Math.random() * 1.5,
        // для ломающихся
        broken: false,
        breakTimer: 0
      };
    }

    function createBonus(x, y) {
      return {
        x: x,
        y: y,
        width: 36,
        height: 36,
        collected: false
      };
    }

    function initPlatforms() {
      platforms = [];
      bonuses = [];
      bonusActive = false;
      bonusTimer = 0;

      // стартовая платформа под игроком
      platforms.push({
        x: WIDTH / 2 - PLATFORM_WIDTH / 2,
        y: HEIGHT - 80,
        width: PLATFORM_WIDTH,
        height: PLATFORM_HEIGHT,
        type: 'normal',
        dir: 1,
        speed: 0,
        broken: false,
        breakTimer: 0
      });

      // генерируем платформы вверх
      let y = HEIGHT - 180;
      while (y > -HEIGHT * 2) {
        platforms.push(createPlatform(y));
        const last = platforms[platforms.length - 1];
        // Бонус только на обычных платформах (не на пружинах, ломающихся, движущихся)
        if (last.type === 'normal' && Math.random() < 0.14) {
          bonuses.push(createBonus(
            last.x + last.width / 2 - 18,
            last.y - 50
          ));
        }
        y -= 50 + Math.random() * 70;
      }
    }

    function generateMorePlatforms() {
      let highest = platforms.reduce((min, p) => Math.min(min, p.y), Infinity);
      while (highest > cameraY - HEIGHT) {
        highest -= 55 + Math.random() * 75;
        platforms.push(createPlatform(highest));
        const last = platforms[platforms.length - 1];
        // Бонус только на обычных платформах, и не во время действия бонуса
        if (!bonusActive && last.type === 'normal' && Math.random() < 0.14) {
          bonuses.push(createBonus(
            last.x + last.width / 2 - 18,
            last.y - 50
          ));
        }
      }
    }

    // ---------- УПРАВЛЕНИЕ ----------
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' && gameState === 'gameover') restart();
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    // Тач (сниженная чувствительность)
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (gameState !== 'playing') return;
      touchX = e.touches[0].clientX;
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (gameState !== 'playing' || touchX === null) return;
      const currentX = e.touches[0].clientX;
      const dx = currentX - touchX;
      // Порог увеличен: нужно сдвинуть палец сильнее
      if (dx < -22) { keys.left = true; keys.right = false; touchX = currentX; }
      else if (dx > 22) { keys.right = true; keys.left = false; touchX = currentX; }
      // Небольшой дрейф — сбрасываем направление
      else if (Math.abs(dx) < 6) {
        keys.left = false;
        keys.right = false;
      }
    }, { passive: false });
    canvas.addEventListener('touchend', () => {
      keys.left = false;
      keys.right = false;
      touchX = null;
    });

    // Мышь (для удобства на ПК)
    let mouseDown = false;
    canvas.addEventListener('mousedown', e => {
      mouseDown = true;
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (WIDTH / rect.width);
      if (mx < player.x + player.width / 2) keys.left = true;
      else keys.right = true;
    });
    canvas.addEventListener('mouseup', () => {
      mouseDown = false;
      keys.left = false;
      keys.right = false;
    });
    canvas.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (WIDTH / rect.width);
      keys.left = mx < player.x + player.width / 2;
      keys.right = !keys.left;
    });

    restartBtn.addEventListener('click', restart);

    // ---------- ФИЗИКА И ЛОГИКА ----------
    function update() {
      if (gameState !== 'playing' || isPaused) return;

      // --- Бонус-эффект ---
      if (bonusActive) {
        bonusTimer--;
        // Постоянный полёт вверх (как от пружины)
        player.vy = BONUS_FLY_FORCE;
        // Звёздочки эффекта скорости
        spawnBonusParticles();
        if (bonusTimer <= 0) {
          bonusActive = false;
        }
      }
      updateParticles();

      // Горизонтальное движение (работает и во время бонуса)
      if (keys.left) {
        player.vx = -MOVE_SPEED;
        player.facing = -1;
      } else if (keys.right) {
        player.vx = MOVE_SPEED;
        player.facing = 1;
      } else {
        player.vx *= 0.85;
      }

      player.x += player.vx;

      // Экран зациклен по горизонтали
      if (player.x + player.width < 0) player.x = WIDTH;
      if (player.x > WIDTH) player.x = -player.width;

      // Гравитация (не применяется во время бонуса)
      if (!bonusActive) {
        player.vy += GRAVITY;
      }
      player.y += player.vy;

      // Камера следует за игроком вверх
      if (player.y < cameraY + HEIGHT * 0.4) {
        cameraY = player.y - HEIGHT * 0.4;
      }

      // Обновление платформ
      for (let p of platforms) {
        if (p.type === 'moving' && !p.broken) {
          p.x += p.dir * p.speed;
          if (p.x <= 0 || p.x + p.width >= WIDTH) p.dir *= -1;
        }
        if (p.broken) {
          p.breakTimer++;
          p.y += 4;
        }
      }

      // Коллизии с бонусами (не подбираем новые во время действия бонуса)
      if (!bonusActive) {
        for (let b of bonuses) {
          if (b.collected) continue;
          if (player.x < b.x + b.width &&
              player.x + player.width > b.x &&
              player.y < b.y + b.height &&
              player.y + player.height > b.y) {
            // Поймали бонус!
            b.collected = true;
            bonusActive = true;
            bonusTimer = BONUS_DURATION;
            playBonusSound();
          }
        }
      }

      // Коллизии с платформами (только когда падаем и бонус НЕ активен)
      if (player.vy > 0 && !bonusActive) {
        for (let p of platforms) {
          if (p.broken) continue;

          if (player.x + player.width > p.x + 8 &&
              player.x < p.x + p.width - 8 &&
              player.y + player.height > p.y &&
              player.y + player.height < p.y + p.height + player.vy + 2) {

            player.y = p.y - player.height;
            player.vy = JUMP_FORCE;

            if (p.type === 'spring') {
              player.vy = JUMP_FORCE * 1.7;
              playSpringSound();
            } else {
              playJumpSound();
            }
            if (p.type === 'breaking') {
              p.broken = true;
              p.breakTimer = 0;
            }
            break;
          }
        }
      }

      // Подсчёт высоты
      const currentHeight = Math.max(0, Math.floor((-cameraY) / 10));
      if (currentHeight > maxHeight) {
        maxHeight = currentHeight;
        score = maxHeight;
        scoreEl.textContent = score;
      }

      // Генерация новых платформ
      generateMorePlatforms();

      // Удаление старых объектов далеко внизу
      platforms = platforms.filter(p => p.y < cameraY + HEIGHT + 100);
      bonuses = bonuses.filter(b => !b.collected && b.y < cameraY + HEIGHT + 100);

      // Проверка проигрыша (во время бонуса не проигрываем)
      if (!bonusActive && player.y > cameraY + HEIGHT + 50) {
        gameOver();
      }
    }

    function gameOver() {
      gameState = 'gameover';
      finalScoreEl.textContent = score;
      gameOverEl.style.display = 'block';
      hintEl.style.display = 'none';
      scoreEl.style.display = 'none';
    }

    function startGame() {
      // Разблокируем звук (браузеры требуют жест пользователя)
      getAudioCtx();
      startMusic();

      // Устанавливаем выбранного персонажа
      currentPlayerImg = playerImgs[selectedCharacter];

      player.x = WIDTH / 2 - PLAYER_WIDTH / 2;
      player.y = HEIGHT - 150;
      player.vx = 0;
      player.vy = 0;
      player.width = PLAYER_WIDTH;
      player.height = PLAYER_HEIGHT;
      cameraY = 0;
      maxHeight = 0;
      score = 0;
      bonusActive = false;
      bonusTimer = 0;
      particles = [];
      isPaused = false;
      scoreEl.textContent = '0';
      scoreEl.style.display = 'block';
      gameState = 'playing';
      gameOverEl.style.display = 'none';
      hintEl.style.display = 'block';
      initPlatforms();
    }

    function restart() {
      // После game over возвращаемся на титульный экран
      gameState = 'title';
      gameOverEl.style.display = 'none';
      scoreEl.style.display = 'none';
      hintEl.style.display = 'none';
    }

    // ---------- ОТРИСОВКА ----------
    function drawBackground() {
      if (isImageReady(bgImg)) {
        // Параллакс: фон скроллится медленнее камеры (0.3x)
        const parallax = 0.3;
        const bgH = HEIGHT;
        let offset = (-cameraY * parallax) % bgH;
        if (offset > 0) offset -= bgH;

        for (let i = -1; i <= 2; i++) {
          ctx.drawImage(bgImg, 0, offset + i * bgH, WIDTH, bgH);
        }
      } else {
        // Стандартный фон — градиент + облака с параллаксом
        const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        grad.addColorStop(0, '#5B9BD5');
        grad.addColorStop(0.6, '#87CEEB');
        grad.addColorStop(1, '#E0F7FA');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        drawCloud(60,  (80  + cameraY * 0.08) % (HEIGHT + 100) - 50, 50);
        drawCloud(280, (180 + cameraY * 0.12) % (HEIGHT + 120) - 50, 40);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        drawCloud(150, (320 + cameraY * 0.18) % (HEIGHT + 80)  - 50, 55);
        drawCloud(320, (450 + cameraY * 0.15) % (HEIGHT + 100) - 50, 35);
      }
    }

    function drawCloud(x, y, size) {
      ctx.beginPath();
      ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
      ctx.arc(x + size * 0.4, y - size * 0.15, size * 0.4, 0, Math.PI * 2);
      ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlatform(p) {
      const screenY = p.y - cameraY;

      if (screenY < -50 || screenY > HEIGHT + 50) return;

      if (p.broken && p.breakTimer > 8) return; // уже разлетелась

      // Мягкая тень под платформой (объём)
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(p.x + p.width / 2, screenY + p.height + 4, p.width * 0.42, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // --- Рисуем основу платформы ---
      let baseImg = null;
      if (p.type === 'breaking') baseImg = brokenPlatformImg;
      else if (p.type === 'moving') baseImg = movingPlatformImg;
      else baseImg = platformImg;

      if (isImageReady(baseImg)) {
        ctx.drawImage(baseImg, p.x, screenY, p.width, p.height);
      } else {
        ctx.fillStyle = {
          'normal': '#4CAF50',
          'moving': '#2196F3',
          'breaking': '#FF9800',
          'spring': '#4CAF50'
        }[p.type] || '#4CAF50';

        roundRect(p.x, screenY, p.width, p.height, 6);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        roundRect(p.x + 4, screenY + 2, p.width - 8, 4, 3);
        ctx.fill();
      }

      // --- Рисуем пружину сверху (если это spring) ---
      if (p.type === 'spring') {
        if (isImageReady(springImg)) {
          // Рисуем пружину с сохранением пропорций
          // Размер пружины: ширина ~40% от платформы, высота пропорционально
          const springW = Math.min(42, p.width * 0.55);
          const aspect = springImg.naturalHeight / springImg.naturalWidth;
          const springH = springW * aspect;

          const springX = p.x + (p.width - springW) / 2;
          const springY = screenY - springH + 4; // чуть заходит на платформу

          ctx.drawImage(springImg, springX, springY, springW, springH);
        } else {
          // Стандартная пружина (если spring.png нет)
          ctx.fillStyle = '#C2185B';
          ctx.fillRect(p.x + p.width / 2 - 8, screenY - 14, 16, 14);
          ctx.fillStyle = '#F48FB1';
          ctx.fillRect(p.x + p.width / 2 - 6, screenY - 11, 12, 10);
        }
      }
    }

    // ---------- ЧАСТИЦЫ (звёздочки при бонусе) ----------
    function spawnBonusParticles() {
      // 2-3 звёздочки за кадр
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: player.x + player.width / 2 + (Math.random() - 0.5) * 40,
          y: player.y + player.height / 2 + (Math.random() - 0.5) * 30,
          vx: (Math.random() - 0.5) * 3,
          vy: Math.random() * 4 + 2, // летят вниз относительно персонажа
          life: 25 + Math.random() * 20,
          maxLife: 45,
          size: 3 + Math.random() * 5,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.3
        });
      }
      // Ограничиваем количество
      if (particles.length > 80) particles.splice(0, particles.length - 80);
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.rot += p.rotSpeed;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const screenY = p.y - cameraY;
        if (screenY < -20 || screenY > HEIGHT + 20) continue;
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.save();
        ctx.translate(p.x, screenY);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        // Звёздочка
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
          const r = i % 2 === 0 ? p.size : p.size * 0.4;
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        // Блик
        ctx.fillStyle = '#FFFde7';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawPlayer() {
      const screenY = player.y - cameraY;
      const img = currentPlayerImg;
      const scale = bonusActive ? BONUS_SCALE : 1;

      // Наклон при движении влево/вправо (эффект перемещения)
      const tilt = Math.max(-0.25, Math.min(0.25, player.vx * 0.04));

      // Мягкая тень под персонажем (объём)
      const shadowScale = scale;
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      ctx.ellipse(
        player.x + player.width / 2,
        screenY + player.height + 3,
        16 * shadowScale,
        5 * Math.min(shadowScale, 1.5),
        0, 0, Math.PI * 2
      );
      ctx.fill();

      if (isImageReady(img)) {
        // Сохраняем пропорции + учитываем бонус-скейл
        const aspect = img.naturalWidth / img.naturalHeight;
        const drawH = PLAYER_HEIGHT * scale;
        const drawW = drawH * aspect;

        // Ноги остаются на месте (растём вверх и в стороны)
        const drawX = player.x + (player.width - drawW) / 2;
        const drawY = screenY + player.height - drawH;

        // Центр для поворота (ближе к ногам)
        const cx = drawX + drawW / 2;
        const cy = drawY + drawH * 0.7;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(tilt);

        // Лёгкое свечение по контуру — отделяет от фона и даёт объём
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;

        ctx.drawImage(img, -drawW / 2, -drawH * 0.7, drawW, drawH);

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.restore();
      } else {
        // Стандартный персонаж
        ctx.save();
        const offsetY = bonusActive ? -(PLAYER_HEIGHT * (scale - 1)) / 2 : 0;
        ctx.translate(player.x + player.width / 2, screenY + player.height / 2 + offsetY);
        ctx.rotate(tilt);
        ctx.scale(scale, scale);

        ctx.fillStyle = '#FFEB3B';
        ctx.beginPath();
        ctx.ellipse(0, 0, 18, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(6, -6, 4, 0, Math.PI * 2);
        ctx.arc(14, -6, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(7, -7, 1.5, 0, Math.PI * 2);
        ctx.arc(15, -7, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(10, 2, 6, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.fillStyle = '#FBC02D';
        ctx.fillRect(-12, 16, 8, 10);
        ctx.fillRect(4, 16, 8, 10);

        ctx.restore();
      }
    }

    function drawBonus(b) {
      if (b.collected) return;
      const screenY = b.y - cameraY;
      if (screenY < -50 || screenY > HEIGHT + 50) return;

      // Мягкое свечение под бонусом
      ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
      ctx.beginPath();
      ctx.arc(b.x + b.width / 2, screenY + b.height / 2, 24, 0, Math.PI * 2);
      ctx.fill();

      if (isImageReady(bonusImg)) {
        // Фиксированный размер ~40px по большей стороне, пропорции сохраняем
        const nw = bonusImg.naturalWidth;
        const nh = bonusImg.naturalHeight;
        const maxSize = 42;
        let w, h;
        if (nw >= nh) {
          w = maxSize;
          h = maxSize * (nh / nw);
        } else {
          h = maxSize;
          w = maxSize * (nw / nh);
        }
        const x = b.x + (b.width - w) / 2;
        const y = screenY + (b.height - h) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(255, 180, 0, 0.45)';
        ctx.shadowBlur = 12;
        ctx.drawImage(bonusImg, x, y, w, h);
        ctx.shadowBlur = 0;
        ctx.restore();
      } else {
        // Fallback если картинка не загрузилась
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(b.x + b.width / 2, screenY + b.height / 2, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFA000';
        ctx.beginPath();
        ctx.arc(b.x + b.width / 2, screenY + b.height / 2, 10, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---------- ТИТУЛЬНЫЙ ЭКРАН ----------
    // Координаты элементов (для кликов)
    const titleLayout = {
      charSize: 90,
      charY: 320,
      charGap: 30,
      startBtnW: 180,
      startBtnH: 70,
      startBtnY: 480
    };

    function getCharPositions() {
      const totalW = 3 * titleLayout.charSize + 2 * titleLayout.charGap;
      const startX = (WIDTH - totalW) / 2;
      return [0, 1, 2].map(i => startX + i * (titleLayout.charSize + titleLayout.charGap));
    }

    function drawTitleScreen() {
      // Фон
      if (isImageReady(bgImg)) {
        ctx.drawImage(bgImg, 0, 0, WIDTH, HEIGHT);
      } else {
        const grad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(0.5, '#16213e');
        grad.addColorStop(1, '#0f3460');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      // Затемнение для читаемости
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // --- Название ---
      if (isImageReady(titleNameImg)) {
        const maxW = WIDTH * 0.85;
        const aspect = titleNameImg.naturalWidth / titleNameImg.naturalHeight;
        let tw = maxW;
        let th = tw / aspect;
        if (th > 140) {
          th = 140;
          tw = th * aspect;
        }
        ctx.drawImage(titleNameImg, (WIDTH - tw) / 2, 80, tw, th);
      } else {
        // Fallback текст
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 10;
        ctx.fillText('Monster Jump', WIDTH / 2, 140);
        ctx.shadowBlur = 0;
      }

      // Подпись
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '16px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Выбери персонажа', WIDTH / 2, 260);

      // --- 3 персонажа ---
      const positions = getCharPositions();
      const colors = ['#FFEB3B', '#4FC3F7', '#FF8A65']; // fallback цвета

      for (let i = 0; i < 3; i++) {
        const x = positions[i];
        const y = titleLayout.charY;
        const size = titleLayout.charSize;
        const isSelected = selectedCharacter === i;

        // Рамка выбора
        if (isSelected) {
          ctx.strokeStyle = '#4ecdc4';
          ctx.lineWidth = 4;
          ctx.beginPath();
          roundRect(x - 8, y - 8, size + 16, size + 16, 12);
          ctx.stroke();

          // Подсветка
          ctx.fillStyle = 'rgba(78, 205, 196, 0.15)';
          roundRect(x - 8, y - 8, size + 16, size + 16, 12);
          ctx.fill();
        }

        // Спрайт персонажа
        const img = playerImgs[i];
        if (isImageReady(img)) {
          const aspect = img.naturalWidth / img.naturalHeight;
          let dw = size;
          let dh = size / aspect;
          if (dh > size) {
            dh = size;
            dw = size * aspect;
          }
          const dx = x + (size - dw) / 2;
          const dy = y + (size - dh) / 2;
          ctx.drawImage(img, dx, dy, dw, dh);
        } else {
          // Fallback кружок с номером
          ctx.fillStyle = colors[i];
          ctx.beginPath();
          ctx.arc(x + size / 2, y + size / 2, size / 2 - 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#333';
          ctx.font = 'bold 28px Segoe UI';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(i + 1), x + size / 2, y + size / 2);
          ctx.textBaseline = 'alphabetic';
        }
      }

      // --- Кнопка Старт ---
      const btnX = (WIDTH - titleLayout.startBtnW) / 2;
      const btnY = titleLayout.startBtnY;

      if (isImageReady(startBtnImg)) {
        const aspect = startBtnImg.naturalWidth / startBtnImg.naturalHeight;
        let bw = titleLayout.startBtnW;
        let bh = bw / aspect;
        if (bh > 80) {
          bh = 80;
          bw = bh * aspect;
        }
        ctx.drawImage(startBtnImg, (WIDTH - bw) / 2, btnY, bw, bh);
        // Сохраняем реальные размеры для клика
        titleLayout._btnX = (WIDTH - bw) / 2;
        titleLayout._btnY = btnY;
        titleLayout._btnW = bw;
        titleLayout._btnH = bh;
      } else {
        // Fallback кнопка
        ctx.fillStyle = '#4ecdc4';
        roundRect(btnX, btnY, titleLayout.startBtnW, titleLayout.startBtnH, 16);
        ctx.fill();
        ctx.fillStyle = '#1a1a2e';
        ctx.font = 'bold 26px Segoe UI';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('START', WIDTH / 2, btnY + titleLayout.startBtnH / 2);
        ctx.textBaseline = 'alphabetic';

        titleLayout._btnX = btnX;
        titleLayout._btnY = btnY;
        titleLayout._btnW = titleLayout.startBtnW;
        titleLayout._btnH = titleLayout.startBtnH;
      }

      // Кнопка музыки на титуле
      drawHUDButtons();
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      if (gameState === 'title') {
        drawTitleScreen();
        return;
      }

      // Игровой экран
      drawBackground();

      for (let p of platforms) {
        drawPlatform(p);
      }

      // Бонусы
      for (let b of bonuses) {
        drawBonus(b);
      }

      // Звёздочки (под персонажем)
      drawParticles();

      drawPlayer();

      // Индикатор бонуса (полоска времени)
      if (bonusActive) {
        const barW = 120;
        const barH = 10;
        const barX = (WIDTH - barW) / 2;
        const barY = 60;
        const progress = bonusTimer / BONUS_DURATION;

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        roundRect(barX - 2, barY - 2, barW + 4, barH + 4, 6);
        ctx.fill();

        ctx.fillStyle = '#FFD700';
        roundRect(barX, barY, barW * progress, barH, 4);
        ctx.fill();
      }

      // Кнопки паузы и музыки (правый верхний угол)
      drawHUDButtons();

      // Оверлей паузы
      if (isPaused) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ПАУЗА', WIDTH / 2, HEIGHT / 2 - 10);
        ctx.font = '16px Segoe UI, Arial';
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText('Нажми кнопку паузы чтобы продолжить', WIDTH / 2, HEIGHT / 2 + 30);
      }

      // Виньетка
      const vignette = ctx.createRadialGradient(WIDTH/2, HEIGHT/2, HEIGHT*0.3, WIDTH/2, HEIGHT/2, HEIGHT*0.9);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.15)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    // Кнопки UI
    const pauseBtn = { x: WIDTH - 50, y: 16, size: 36 };
    const musicBtn = { x: WIDTH - 96, y: 16, size: 36 };

    function drawHUDButtons() {
      // --- Пауза (только в игре) ---
      if (gameState === 'playing') {
        const { x, y, size } = pauseBtn;
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        roundRect(x, y, size, size, 8);
        ctx.fill();

        ctx.fillStyle = '#fff';
        if (isPaused) {
          ctx.beginPath();
          ctx.moveTo(x + 12, y + 10);
          ctx.lineTo(x + 12, y + size - 10);
          ctx.lineTo(x + size - 10, y + size / 2);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(x + 11, y + 10, 5, size - 20);
          ctx.fillRect(x + 20, y + 10, 5, size - 20);
        }
      }

      // --- Музыка (титул + игра) ---
      if (gameState === 'title' || gameState === 'playing') {
        const { x, y, size } = musicBtn;
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        roundRect(x, y, size, size, 8);
        ctx.fill();

        ctx.fillStyle = musicEnabled ? '#fff' : '#ff6b6b';
        // Иконка ноты / динамика
        const cx = x + size / 2;
        const cy = y + size / 2;
        // Корпус динамика
        ctx.beginPath();
        ctx.moveTo(cx - 8, cy - 5);
        ctx.lineTo(cx - 2, cy - 5);
        ctx.lineTo(cx + 5, cy - 11);
        ctx.lineTo(cx + 5, cy + 11);
        ctx.lineTo(cx - 2, cy + 5);
        ctx.lineTo(cx - 8, cy + 5);
        ctx.closePath();
        ctx.fill();

        if (musicEnabled) {
          // Волны звука
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx + 6, cy, 5, -0.7, 0.7);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + 6, cy, 9, -0.7, 0.7);
          ctx.stroke();
        } else {
          // Перечёркнуто
          ctx.strokeStyle = '#ff6b6b';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x + 8, y + size - 8);
          ctx.lineTo(x + size - 8, y + 8);
          ctx.stroke();
        }
      }
    }

    // ---------- ОБРАБОТКА КЛИКОВ НА ТИТУЛЬНОМ ЭКРАНЕ ----------
    function handleTitleClick(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      const mx = (clientX - rect.left) * scaleX;
      const my = (clientY - rect.top) * scaleY;

      // Любой клик на титуле — пробуем запустить музыку
      startMusic();

      // Кнопка музыки на титуле
      {
        const { x, y, size } = musicBtn;
        if (mx >= x && mx <= x + size && my >= y && my <= y + size) {
          toggleMusic();
          return;
        }
      }

      // Клик по персонажам
      const positions = getCharPositions();
      for (let i = 0; i < 3; i++) {
        const x = positions[i];
        const y = titleLayout.charY;
        const size = titleLayout.charSize;
        if (mx >= x - 8 && mx <= x + size + 8 && my >= y - 8 && my <= y + size + 8) {
          selectedCharacter = i;
          return;
        }
      }

      // Клик по кнопке Старт
      const bx = titleLayout._btnX || (WIDTH - titleLayout.startBtnW) / 2;
      const by = titleLayout._btnY || titleLayout.startBtnY;
      const bw = titleLayout._btnW || titleLayout.startBtnW;
      const bh = titleLayout._btnH || titleLayout.startBtnH;

      if (mx >= bx && mx <= bx + bw && my >= by && my <= by + bh) {
        startGame();
      }
    }

    function handleGameClick(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      const mx = (clientX - rect.left) * scaleX;
      const my = (clientY - rect.top) * scaleY;

      if (gameState === 'playing') {
        // Кнопка паузы
        {
          const { x, y, size } = pauseBtn;
          if (mx >= x && mx <= x + size && my >= y && my <= y + size) {
            isPaused = !isPaused;
            keys.left = false;
            keys.right = false;
            return;
          }
        }
        // Кнопка музыки
        {
          const { x, y, size } = musicBtn;
          if (mx >= x && mx <= x + size && my >= y && my <= y + size) {
            toggleMusic();
            return;
          }
        }
      }
    }

    canvas.addEventListener('click', e => {
      if (gameState === 'title') {
        handleTitleClick(e.clientX, e.clientY);
      } else if (gameState === 'playing') {
        handleGameClick(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length === 0) return;
      const t = e.changedTouches[0];
      if (gameState === 'title') {
        e.preventDefault();
        handleTitleClick(t.clientX, t.clientY);
      } else if (gameState === 'playing') {
        handleGameClick(t.clientX, t.clientY);
      }
    }, { passive: false });

    // Клавиша P / Escape — пауза
    window.addEventListener('keydown', e => {
      if ((e.code === 'KeyP' || e.code === 'Escape') && gameState === 'playing') {
        isPaused = !isPaused;
        keys.left = false;
        keys.right = false;
      }
    });

    // ---------- ГЛАВНЫЙ ЦИКЛ ----------
    function loop() {
      if (gameState === 'playing') {
        update();
      }
      draw();
      requestAnimationFrame(loop);
    }

    // Старт с титульного экрана
    loop();
  </script>
</body>
</html>
