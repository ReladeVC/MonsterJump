canvas { display: block; position: relative; z-index: 1; background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%); box-shadow: 0 0 40px rgba(0,0,0,0.55); max-width: 100%; max-height: 100%; image-rendering: auto; }

#game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: url('assets/backgroundmenu.png') center / 100% 100% no-repeat; color: #783915 !important; opacity: 1 !important; padding: 36px 40px 32px; border-radius: 24px; text-align: center; pointer-events: auto; box-shadow: none; border: none; min-width: 280px; overflow: hidden; text-shadow: none; filter: none; -webkit-font-smoothing: antialiased; }

#game-over-stats { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: 24px; }
#game-over-stats .stat-row { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #783915 !important; opacity: 1 !important; }
#game-over-stats .stat-row img { width: 28px; height: 28px; object-fit: contain; opacity: 1 !important; filter: none; }
#game-over-stats .stat-row span { min-width: 40px; text-align: left; color: #783915 !important; opacity: 1 !important; }

function saveProgress() {

    } catch (e) {}
}

function upgradeCharacter(i) {
    if (i < 0 || i >= 6) return false;
    if (!isCharUnlocked(i)) return false;
    const cur = charLevels[i] || 1;
    if (cur >= 99) return false;
    if (totalCrystals < CHAR_UPGRADE_COST) { coinShake = 18; return false; }
    totalCrystals -= CHAR_UPGRADE_COST;
    charLevels[i] = Math.min(99, cur + 1);
    saveProgress();
    playLevelUpSound();
    return true;
}

function resetCharacterLevel(i) {
    if (i < 0 || i >= 6) return false;
    const cur = charLevels[i] || 1;
    if (cur <= 1) return false;
    const refund = (cur - 1) * CHAR_UPGRADE_COST;
    totalCrystals += refund;
    charLevels[i] = 1;
    saveProgress();
    playCoinSound();
    coinShake = 15;
    return true;
}

function isCharUnlocked(i) {
    if (i === 0 || unlockedChars[i]) return true;
    const info = CHAR_INFO[i];
    if (info.unlock === 'height' && typeof bestScore === 'number' && bestScore >= info.heightReq) {
        unlockedChars[i] = true; saveProgress(); return true;
    }
    return false;
}
function triggerNoMoneyShake(charIndex) { charShake[charIndex] = 24; coinShake = 24; }

let assetsLoaded = 0;

function loadImage(src) {
    const img = new Image(); assetsTotal++; let settled = false;
    const done = () => { if (settled) return; settled = true; assetsLoaded++; };
    img.onload = done; img.onerror = () => { console.warn('Failed:', src); done(); };
    img.src = src; if (img.complete) done(); return img;
}
function loadImageWithFallback(paths) {
    const img = new Image(); assetsTotal++; let settled = false; let index = 0;
    const done = () => { if (settled) return; settled = true; assetsLoaded++; };
    function tryNext() {
        if (index >= paths.length) { console.warn('Not found:', paths[0]); done(); return; }
        img.src = paths[index++]; if (img.complete && img.naturalWidth > 0) done();
    }
    img.onload = done; img.onerror = tryNext; tryNext(); return img;
}

function pickPlatformType(){const r=Math.random();const lv=currentLevel||0;let stage=0;if(lv>0&&levelTarget>0)stage=Math.max(0,Math.min(1,score/levelTarget));if(lv>=41&&lv<=60){if(r<0.52)return'breaking';if(r<0.62)return'moving';if(r<0.72)return'spring';return'normal';}if(lv>=61&&lv<=80){if(r<0.52)return'moving';if(r<0.62)return'breaking';if(r<0.72)return'spring';return'normal';}if(lv>=81&&lv<=100){const special=0.28+stage*0.42;const breakShare=0.45+stage*0.1;if(r<special*breakShare)return'breaking';if(r<special)return'moving';if(r<special+0.08)return'spring';return'normal';}const types=['normal','normal','normal','moving','breaking','spring'];return types[Math.floor(Math.random()*types.length)];}
function createPlatform(y,type=null){const t=type||pickPlatformType();const w=PLATFORM_WIDTH;const h=PLATFORM_HEIGHT;return{x:Math.random()*(WIDTH-w),y:y,width:w,height:h,type:t,dir:Math.random()>0.5?1:-1,speed:1.8+Math.random()*1.4,phase:Math.random()*Math.PI*2,bob:0,broken:false,breakTimer:0};}
function createBonus(x,y){return{x:x,y:y,width:36,height:36,collected:false};}
function createCoin(x,y){return{x:x,y:y,width:28,height:28,collected:false,magnetized:false,phase:Math.random()*Math.PI*2,vx:0,vy:0};}
function spawnCoinsNear(y){const count=2+Math.floor(Math.random()*3);const minDist=42;const placed=[];let attempts=0;while(placed.length<count&&attempts<40){attempts++;const cx=24+Math.random()*(WIDTH-72);const cy=y-25-Math.random()*80;let ok=true;for(const p of placed){const dx=p.x-cx;const dy=p.y-cy;if(dx*dx+dy*dy<minDist*minDist){ok=false;break;}}if(ok){for(const c of coins){if(c.collected)continue;const dx=c.x-cx;const dy=c.y-cy;if(dx*dx+dy*dy<minDist*minDist){ok=false;break;}}}if(ok){placed.push({x:cx,y:cy});coins.push(createCoin(cx,cy));}}}
function initPlatforms(){platforms=[];bonuses=[];coins=[];bonusActive=false;bonusTimer=0;bonusVisualScale=1;bonus1Pending=false;bonusesLockedUntilLand=false;runCoins=0;platforms.push({x:WIDTH/2-PLATFORM_WIDTH/2,y:HEIGHT-80,width:PLATFORM_WIDTH,height:PLATFORM_HEIGHT,type:'normal',dir:1,speed:0,phase:0,bob:0,broken:false,breakTimer:0});let y=HEIGHT-200;let prevWasSpring=false;while(y>-HEIGHT*2){if(prevWasSpring)y-=70+Math.random()*40;const p=createPlatform(y);avoidAboveSprings(p);platforms.push(p);prevWasSpring=(p.type==='spring');if(p.type==='normal'&&Math.random()<0.12)bonuses.push(createBonus(p.x+p.width/2-18,p.y-50));if(Math.random()<0.85)spawnCoinsNear(y);y-=90+Math.random()*60;}}
function avoidAboveSprings(p){for(const s of platforms){if(s.type!=='spring')continue;const dy=s.y-p.y;if(dy>0&&dy<140){const overlap=p.x<s.x+s.width+10&&p.x+p.width>s.x-10;if(overlap){if(s.x>WIDTH/2)p.x=Math.max(0,s.x-PLATFORM_WIDTH-30-Math.random()*40);else p.x=Math.min(WIDTH-PLATFORM_WIDTH,s.x+s.width+30+Math.random()*40);}}}}
function generateMorePlatforms(){let highest=platforms.reduce((min,p)=>Math.min(min,p.y),Infinity);let prevWasSpring=platforms.length&&platforms[platforms.length-1].type==='spring';while(highest>cameraY-HEIGHT){highest-=90+Math.random()*60;if(prevWasSpring)highest-=70+Math.random()*40;const p=createPlatform(highest);avoidAboveSprings(p);platforms.push(p);prevWasSpring=(p.type==='spring');if(!bonusActive&&p.type==='normal'&&Math.random()<0.12)bonuses.push(createBonus(p.x+p.width/2-18,p.y-50));if(Math.random()<0.85)spawnCoinsNear(highest);}}
function collectCoin(c){if(c.collected)return;c.collected=true;const amount=hasCoinDouble()?2:1;runCoins+=amount;totalCoins+=amount;saveProgress();playCoinSound();spawnCoinParticles(c.x+c.width/2,c.y+c.height/2);}
function buyBonus(which){if(which===1){if(totalCoins>=BONUS1_PRICE){totalCoins-=BONUS1_PRICE;invBonus1++;saveProgress();return true;}coinShake=20;return false;}if(which===2){if(totalCoins>=BONUS2_PRICE){totalCoins-=BONUS2_PRICE;invBonus2++;saveProgress();return true;}coinShake=20;return false;}if(which===3){if(totalCoins>=BONUS3_PRICE){totalCoins-=BONUS3_PRICE;invBonus3++;saveProgress();return true;}coinShake=20;return false;}return false;}
function useBonus1(){if(invBonus1<=0||bonusActive||bonus1Pending||bonusesLockedUntilLand||cdBonus1>0||gameState!=='playing'||isPaused)return false;invBonus1--;saveProgress();bonus1Pending=true;missionStats.use_bonus1=(missionStats.use_bonus1||0)+1;saveMetaProgress();playBonusSound();return true;}
function activateBonus1(){if(!bonus1Pending||bonusActive)return;bonus1Pending=false;bonusActive=true;bonusTimer=BONUS_DURATION;bonus1TargetY=player.y-BONUS1_WORLD;}
function useBonus2(){if(invBonus2<=0||cdBonus2>0||bonus2CdPending||bonusesLockedUntilLand||gameState!=='playing'||isPaused)return false;if(extraLifeReady)return false;invBonus2--;saveProgress();extraLifeReady=true;bonus2FromItem=true;missionStats.use_bonus2=(missionStats.use_bonus2||0)+1;saveMetaProgress();playBonusSound();return true;}
function useBonus3(){if(invBonus3<=0||jumpBoostTimer>0||bonusesLockedUntilLand||cdBonus3>0||gameState!=='playing'||isPaused)return false;invBonus3--;saveProgress();jumpBoostTimer=JUMP_BOOST_DURATION;missionStats.use_bonus3=(missionStats.use_bonus3||0)+1;saveMetaProgress();playBonusSound();return true;}
function updateShield(){if(extraLifeReady){shieldAngle+=0.09;if(shieldAngle>Math.PI*2)shieldAngle-=Math.PI*2;}const target=extraLifeReady?1:0;if(shieldVisualScale<target)shieldVisualScale=Math.min(target,shieldVisualScale+SHIELD_SCALE_SPEED);else if(shieldVisualScale>target)shieldVisualScale=Math.max(target,shieldVisualScale-SHIELD_SCALE_SPEED);}

function update(){
    if(gameState==='levelwin'){levelWinTimer++;updateParticles();if(levelWinAnim==='fly'){levelWinFlyTimer++;player.vy-=0.55;player.y+=player.vy;player.x+=player.vx*0.4;const targetCam=player.y-HEIGHT*0.45;cameraY+=(targetCam-cameraY)*0.12;if(levelWinFlyTimer%2===0)particles.push({x:player.x+player.width/2+(Math.random()-0.5)*20,y:player.y+player.height,vx:(Math.random()-0.5)*2,vy:2+Math.random()*3,life:20+Math.random()*15,maxLife:35,size:2+Math.random()*3,rot:0,rotSpeed:0,kind:'star'});const screenY=player.y-cameraY;if(screenY<-80||levelWinFlyTimer>70){levelWinAnim='in';levelWinAnimT=0;}return;}const ANIM_FRAMES=28;if(levelWinAnim==='in'){levelWinAnimT=Math.min(1,levelWinAnimT+1/ANIM_FRAMES);if(levelWinAnimT>=1)levelWinAnim='idle';}else if(levelWinAnim==='out'){levelWinAnimT=Math.max(0,levelWinAnimT-1/ANIM_FRAMES);if(levelWinAnimT<=0){const action=levelWinPending;levelWinPending=null;levelWinAnim='in';if(action==='home'){currentLevel=0;levelTarget=0;levelWinLevel=0;goToMenu();}else if(action==='next'){if(levelWinLevel>=100){currentLevel=0;levelTarget=0;levelWinLevel=0;goToMenu();}else{const next=levelWinLevel+1;currentLevel=next;levelTarget=getLevelTarget(next);levelWinLevel=0;startGame();}}return;}}if(levelWinAnim==='idle'&&levelWinTimer%4===0)particles.push({x:Math.random()*WIDTH,y:-10,vx:(Math.random()-0.5)*2,vy:2+Math.random()*3,life:40+Math.random()*20,maxLife:60,size:2+Math.random()*4,rot:Math.random()*Math.PI,rotSpeed:0.1,kind:'win'});return;}
    if(gameState==='dying'){player.vy+=GRAVITY*1.15;player.y+=player.vy;player.x+=player.vx*0.4;player.vx*=0.98;updateParticles();if(dyingTimer%6===0)particles.push({x:player.x+player.width/2+(Math.random()-0.5)*20,y:player.y+player.height*0.5,vx:(Math.random()-0.5)*1.2,vy:-0.5-Math.random(),life:25+Math.random()*15,maxLife:40,size:6+Math.random()*10,rot:0,rotSpeed:0,kind:'smoke'});if(dyingTimer>0){dyingTimer--;if(dyingTimer<=0){gameState='gameover';gameOverEl.style.display='none';}}return;}
    if(gameState!=='playing'||isPaused)return;
    if(introActive&&!introLaunched){if(introTimer>0){introTimer--;player.vx=0;player.vy=0;player.y=cameraY+HEIGHT+24;updateParticles();updateShield();return;}const basePlat=platforms.reduce((a,b)=>(a.y>b.y?a:b),platforms[0]);player.x=basePlat.x+basePlat.width/2-PLAYER_WIDTH/2;player.y=cameraY+HEIGHT+8;player.vy=JUMP_FORCE*1.25;introLaunched=true;playJumpSound();}
    onPlatform=false;if(cdBonus1>0)cdBonus1--;if(cdBonus2>0)cdBonus2--;if(cdBonus3>0)cdBonus3--;
    if(bonus2CdPending&&!bonus2LandArmed&&player.vy>0)bonus2LandArmed=true;
    if(jumpBoostTimer>0){jumpBoostTimer--;if(jumpBoostTimer<=0)cdBonus3=ABILITY_COOLDOWN;}
    if(bonusActive){bonusTimer--;if(bonusTimer%3===0)spawnBonusParticles();const remainY=player.y-bonus1TargetY;if(bonusTimer>0&&remainY>0){const needVy=-(remainY/Math.max(1,bonusTimer));player.vy+=(needVy-player.vy)*0.35;}if(bonusTimer<=0){if(player.y>bonus1TargetY)player.y=bonus1TargetY;player.vy=Math.min(player.vy,-0.5);bonusActive=false;cdBonus1=ABILITY_COOLDOWN;}}
    const scaleTarget=bonusActive?BONUS_SCALE:1;bonusVisualScale+=(scaleTarget-bonusVisualScale)*0.12;if(Math.abs(bonusVisualScale-scaleTarget)<0.008)bonusVisualScale=scaleTarget;
    updateParticles();updateShield();
    {if(keys.left){player.vx=-MOVE_SPEED;player.facing=-1;}else if(keys.right){player.vx=MOVE_SPEED;player.facing=1;}else{player.vx*=0.78;if(Math.abs(player.vx)<0.15)player.vx=0;}}
    const tiltTarget=Math.max(-0.22,Math.min(0.22,player.vx*0.035));playerTilt+=(tiltTarget-playerTilt)*0.2;player.x+=player.vx;if(player.x+player.width<0)player.x=WIDTH;if(player.x>WIDTH)player.x=-player.width;
    if(!bonusActive){let g=GRAVITY;if(player.vy>0)g=GRAVITY*fallGravityMul();player.vy+=g;}
    player.y+=player.vy;if(invincibleTimer>0)invincibleTimer--;
    {const targetCam=player.y-HEIGHT*0.4;if(player.y<cameraY+HEIGHT*0.4){if(bonusActive||bonusVisualScale>1.02)cameraY+=(targetCam-cameraY)*0.18;else cameraY=targetCam;}}
    for(let p of platforms){if(p.type==='moving'&&!p.broken&&!p.frozen){const prevX=p.x;p.x+=p.dir*p.speed;if(p.x<=0){p.x=0;p.dir=1;}if(p.x+p.width>=WIDTH){p.x=WIDTH-p.width;p.dir=-1;}p.phase=(p.phase||0)+0.08;p.bob=Math.sin(p.phase)*2.5;if(!bonusActive&&player.vy>=0){const onPlatform=player.x+player.width>p.x+6&&player.x<p.x+p.width-6&&Math.abs((player.y+player.height)-p.y)<8;if(onPlatform)player.x+=(p.x-prevX);}}else if(p.type==='normal'||p.type==='spring'){p.phase=(p.phase||0)+0.03;p.bob=Math.sin(p.phase)*0.8;}if(p.broken){p.breakTimer++;p.y+=4;}}
    if(!bonusActive&&!bonus1Pending&&!bonusesLockedUntilLand){for(let b of bonuses){if(b.collected)continue;if(player.x<b.x+b.width&&player.x+player.width>b.x&&player.y<b.y+b.height&&player.y+player.height>b.y){b.collected=true;if(!bonusActive&&!bonus1Pending){bonus1Pending=true;playBonusSound();}}}}
    const magnetOn=hasMagnet();const speedY=Math.abs(player.vy);const bodyScale=bonusVisualScale;const bodyW=PLAYER_WIDTH*bodyScale;const bodyH=PLAYER_HEIGHT*bodyScale;const bodyX=player.x+(player.width-bodyW)/2;const bodyY=player.y+player.height-bodyH;const magnetRange=magnetOn?280+(bonusActive?140:0)+speedY*12:0;const pcx=bodyX+bodyW/2;const pcy=bodyY+bodyH/2;
    for(let c of coins){if(c.collected)continue;c.phase+=0.1;if(magnetOn){const dx=pcx-(c.x+c.width/2);const dy=pcy-(c.y+c.height/2);const dist=Math.sqrt(dx*dx+dy*dy);if(dist<magnetRange)c.magnetized=true;if(c.magnetized&&dist>1){let pull;if(dist<60)pull=Math.min(dist,18+speedY*1.5+(bonusActive?14:0));else if(dist<130)pull=5.5+speedY*0.4;else pull=2.4+speedY*0.2;if(c.y>player.y)pull+=4+speedY*0.6;c.x+=(dx/dist)*pull;c.y+=(dy/dist)*pull;}if(c.magnetized&&dist<36*bodyScale){collectCoin(c);continue;}}const nearPad=4;if(bodyX-nearPad<c.x+c.width&&bodyX+bodyW+nearPad>c.x&&bodyY-nearPad<c.y+c.height&&bodyY+bodyH+nearPad>c.y)collectCoin(c);}
    if(player.vy>0&&!bonusActive){for(let p of platforms){if(p.broken)continue;const screenY=p.y-cameraY;if(screenY<-20||screenY>HEIGHT+10)continue;if(player.x+player.width>p.x+8&&player.x<p.x+p.width-8&&player.y+player.height>p.y&&player.y+player.height<p.y+p.height+player.vy+2){player.y=p.y-player.height;const jumpMul=jumpBoostTimer>0?2:1;onPlatform=true;bonusesLockedUntilLand=false;if(introActive){introActive=false;introLaunched=false;}if(bonus1Pending){activateBonus1();break;}if(bonus2CdPending&&bonus2LandArmed){bonus2CdPending=false;bonus2LandArmed=false;cdBonus2=ABILITY_COOLDOWN;}if(hasMovingFreezeAbility()&&p.type==='moving'&&!p.frozen){p.frozen=true;p.speed=0;p.dir=0;}player.vy=JUMP_FORCE*jumpMul;spawnPlatformDust(player.x+player.width/2,p.y);if(p.type==='spring'){player.vy=JUMP_FORCE*1.7*jumpMul;playSpringSound();}else{playJumpSound();}if(p.type==='breaking'&&!hasSafeBreak()){p.broken=true;p.breakTimer=0;}break;}}}
    const currentHeight=Math.max(0,Math.floor((-cameraY)/10));if(currentHeight>maxHeight){maxHeight=currentHeight;score=maxHeight;scoreEl.textContent=score+' m';if(score>bestScore){bestScore=score;saveProgress();}if(currentLevel>0&&levelTarget>0&&score>=levelTarget)triggerLevelWin(currentLevel);}
    if(maxHeight>2&&hintEl.style.display!=='none')hintEl.style.display='none';
    generateMorePlatforms();platforms=platforms.filter(p=>p.y<cameraY+HEIGHT+100);bonuses=bonuses.filter(b=>!b.collected&&b.y<cameraY+HEIGHT+100);coins=coins.filter(c=>!c.collected&&(c.magnetized||c.y<cameraY+HEIGHT+120));
    if(introActive&&introLaunched&&player.y>cameraY+HEIGHT+50){introActive=false;introLaunched=false;}
    if(!bonusActive&&!introActive&&invincibleTimer<=0&&gameState==='playing'&&player.y>cameraY+HEIGHT+50){if(extraLifeReady){extraLifeReady=false;bonus2FromItem=false;bonus2CdPending=true;bonus2LandArmed=false;bonusesLockedUntilLand=true;player.vy=-Math.sqrt(2*GRAVITY*1000);player.y=cameraY+HEIGHT*0.55;invincibleTimer=180;playSpringSound();}else{startDeathAnimation();}}

function triggerLevelWin(cleared){
    levelWinLevel=cleared;levelWinFirstClear=!levelsCompleted[cleared];levelsCompleted[cleared]=true;
    if(cleared>=maxLevelUnlocked&&cleared<100)maxLevelUnlocked=cleared+1;
    if(levelWinFirstClear){
        totalCoins += LEVEL_REWARD;
        rewardedLevels[cleared] = true;
        totalCrystals += 5000;
        saveProgress();
    }

function drawSpirit() {
    if (selectedSpirit < 0 || gameState !== 'playing') return;
    if (!unlockedSpirits[selectedSpirit]) return;
    const img = spiritImgs[selectedSpirit];
    if (!isImageReady(img)) return;

    const scale = bonusVisualScale;
    const drawH = PLAYER_HEIGHT * scale;
    const drawW = drawH * (isImageReady(currentPlayerImg) ? currentPlayerImg.naturalWidth/currentPlayerImg.naturalHeight : 0.8);

    const cx = player.x + player.width/2;
    const cy = (player.y - cameraY) + player.height - drawH * 0.7;

    // Смещение: базовое + 10px правее
    let offsetX = 40 + (scale > 1.1 ? 10 : 0);
    let offsetY = -40;

    if (extraLifeReady) { offsetX += 25; offsetY -= 10; }

    // Анимация hover
    const time = Date.now() / 300;
    const hoverY = Math.sin(time) * 6;

    const cos = Math.cos(playerTilt);
    const sin = Math.sin(playerTilt);

    const spiritX = cx + (offsetX * cos - (offsetY + hoverY) * sin);
    const spiritY = cy + (offsetX * sin + (offsetY + hoverY) * cos);

    const size = 48;

    ctx.save();
    ctx.translate(spiritX, spiritY);

    // БЕЗ рамки и подложки — только спрайт с прозрачностью
    ctx.globalAlpha = 0.85;
    ctx.drawImage(img, -size/2, -size/2, size, size);
    ctx.restore();
}

function wrapTextStrict(text, maxW, fontSize) {
    ctx.font = fontSize + 'px Segoe UI, Arial';
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) {
            lines.push(line);
            line = w;
            if (ctx.measureText(w).width > maxW) {
                let part = '';
                for (const ch of w) {
                    if (ctx.measureText(part + ch).width > maxW) {
                        lines.push(part);
                        part = ch;
                    } else {
                        part += ch;
                    }
                }
                line = part;
            }
        } else {
            line = test;
        }
    }
    if (line) lines.push(line);
    return lines;
}

function wrapText(text, maxW) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) {
            lines.push(line);
            line = w;
        } else {
            line = test;
        }
    }
    if (line) lines.push(line);
    return lines;
}
function drawTitleMenuPanel() {

    if (titleMenu === 'levels') {
        const cols = 5;

        const gridW = cols * cellW + (cols - 1) * gap;

        const rows = Math.ceil(100 / cols);
        const contentH = rows * (cellH + gap);
        const viewTop = py + 71;
        const viewH = ph - 87;
        levelScrollMax = Math.max(0, contentH - viewH);
        levelScrollY = Math.max(0, Math.min(levelScrollMax, levelScrollY));
        if (!levelDrag && Math.abs(levelScrollV) > 0.05) {
            levelScrollY += levelScrollV;
            levelScrollV *= 0.92;
            if (levelScrollY < 0) { levelScrollY = 0; levelScrollV = 0; }
            if (levelScrollY > levelScrollMax) { levelScrollY = levelScrollMax; levelScrollV = 0; }
        }
        titleLayout._levelClip = { x: px + 4, y: viewTop, w: pw - 8, h: viewH };
        ctx.save();
        ctx.beginPath();
        ctx.rect(px + 4, viewTop, pw - 8, viewH);
        ctx.clip();
        for (let n = 1; n <= 100; n++) {
            const i = n - 1;
            const col = i % cols;
            const row = Math.floor(i / cols);
            const gx = gx0 + col * (cellW + gap);
            const gy2 = viewTop + row * (cellH + gap) - levelScrollY;
            if (gy2 + cellH < viewTop - 4 || gy2 > viewTop + viewH + 4) continue;
            const unlocked = isLevelUnlocked(n);
            const done = !!levelsCompleted[n];
            const bg = getLevelRangeImg(n);
            const lvlPressed = beginPressTransform(gx, gy2, cellW, cellH);
            if (isImageReady(bg)) {
                ctx.save();
                if (!unlocked) ctx.globalAlpha = 0.35;
                else if (done) ctx.globalAlpha = 0.9;
                ctx.drawImage(bg, gx, gy2, cellW, cellH);
                ctx.restore();

                ctx.fillStyle = done ? 'rgba(78,205,196,0.35)' : (unlocked ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.35)');
                roundRect(gx, gy2, cellW, cellH, 8);
                ctx.fill();

            ctx.font = 'bold 20px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const numX = gx + cellW / 2;
            const numY = gy2 + cellH / 2;
            ctx.lineJoin = 'round';
            ctx.miterLimit = 2;
            ctx.strokeStyle = TEXT_COL;
            ctx.lineWidth = 3.5;
            ctx.strokeText(String(n), numX, numY);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(String(n), numX, numY);
            ctx.textBaseline = 'alphabetic';
            if (done && isImageReady(completeImg)) {
                const cs = Math.floor(cellS * 0.38);
                ctx.drawImage(completeImg, gx + cellW - cs - 2, gy2 + cellH - cs - 2, cs, cs);

            if (unlocked) titleLayout._menuHits.push({ type: 'level', n, x: gx, y: gy2, w: cellW, h: cellH });
        }
        ctx.restore();
        if (levelScrollMax > 0) {

    if (currentLevel > 0 && levelTarget > 0) {
        drawOutlinedText('Цель × ' + levelTarget + ' m', scoreX + scoreW / 2, topY + 16, 'bold 14px Segoe UI, Arial', 'center');
    } else {
        if (isImageReady(liderImg)) {
            drawSprite(liderImg, scoreX + 20, topY + 16, 20, 20);
        }
        drawOutlinedText(bestScore + ' m', scoreX + scoreW / 2 + 8, topY + 16, 'bold 16px Segoe UI, Arial', 'center');
    }
    drawOutlinedText(score + ' m', scoreX + scoreW / 2, topY + 34, 'bold 13px Segoe UI, Arial', 'center');
    drawBonusShop(leftX, topY + barH + 10);
}
function drawBonusShop(anchorX, anchorY) {
    shopHit = { b1: null, buy1: null, b2: null, buy2: null, b3: null, buy3: null };
    const colX = 2;
    const cellW = 56;
    const cellH = 52;
    const buyW = 60;
    const buyH = 24;
    const iconBox = 40;
    const gapY = 5;
    let y = anchorY;
    function drawBonusCell(which, img, count) {
        const cellX = colX;
        const cd = which === 1 ? cdBonus1 : (which === 2 ? cdBonus2 : cdBonus3);
        const busy = (which === 1 && (bonusActive || bonus1Pending)) || (which === 2 && (extraLifeReady || bonus2CdPending)) || (which === 3 && jumpBoostTimer > 0);
        drawResourceBarBg(cellX, y, cellW, cellH);
        const cx = cellX + cellW / 2;
        const cy = y + iconBox / 2 + 4;
        if (busy || cd > 0) ctx.globalAlpha = 0.4;
        drawSprite(img, cx, cy, iconBox, iconBox);
        ctx.globalAlpha = 1;
        if (cd > 0) {
            const progress = 1 - cd / ABILITY_COOLDOWN;
            const ringR = iconBox / 2 + 3;
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0,0,0,0.45)';
            ctx.lineWidth = 3;
            ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.strokeStyle = which === 1 ? '#FFD700' : (which === 2 ? '#4FC3F7' : '#CE93D8');
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
            ctx.stroke();
            drawOutlinedText(String(Math.ceil(cd / 60)), cx, cy, 'bold 12px Segoe UI', 'center');
        }
        drawOutlinedText('×' + count, cellX + cellW - 5, y + cellH - 6, 'bold 11px Segoe UI', 'right');
        const useBox = { x: cellX, y: y, w: cellW, h: cellH };
        if (which === 1) shopHit.b1 = useBox;
        else if (which === 2) shopHit.b2 = useBox;
        else shopHit.b3 = useBox;
        y += cellH + 3;
    }
    function drawBuyCell(which, price) {
        const bx = colX;
        drawResourceBarBg(bx, y, buyW, buyH);
        drawSprite(goldImg, bx + 11, y + buyH / 2, 14, 14);
        drawOutlinedText('×' + price, bx + 20, y + buyH / 2, 'bold 11px Segoe UI', 'left');
        const buyBox = { x: bx, y: y, w: buyW, h: buyH };
        if (which === 1) shopHit.buy1 = buyBox;
        else if (which === 2) shopHit.buy2 = buyBox;
        else shopHit.buy3 = buyBox;
        y += buyH + gapY + 3;
    }
    drawBonusCell(1, bonusImg, invBonus1);
    drawBuyCell(1, BONUS1_PRICE);
    drawBonusCell(2, bonus2Img, invBonus2);
    drawBuyCell(2, BONUS2_PRICE);
    drawBonusCell(3, bonus3Img, invBonus3);
    drawBuyCell(3, BONUS3_PRICE);
}
function drawCoin(c) {
    if (c.collected) return;
    const screenY = c.y - cameraY + Math.sin(c.phase) * 3;
    if (screenY < -40 || screenY > HEIGHT + 40) return;
    const size = 32;
    const cx = c.x + c.width / 2;
    const cy = screenY + c.height / 2;
    drawSprite(goldImg, cx, cy, size, size, { shadow: 'rgba(255, 200, 0, 0.35)', blur: 6 });
}
function drawHUDButtons() {
    if (gameState === 'playing') {
        const { x, y, size } = pauseBtn;
        let pPress = beginPressTransform(x, y, size, size);
        drawResourceBarBg(x, y, size, size);
        if (isPaused) {
            drawOutlinedText('▶', x + size / 2, y + size / 2, 'bold 22px Segoe UI, Arial', 'center');
            ctx.strokeStyle = 'rgba(78, 205, 196, 0.7)';
            ctx.lineWidth = 2;
            roundRect(x, y, size, size, 8);
            ctx.stroke();
        } else {
            const bw = 5, bh = 18, gap = 6;
            const pbx = x + size / 2 - (bw * 2 + gap) / 2;
            const pby = y + size / 2 - bh / 2;
            ctx.lineJoin = 'round';
            for (const ox of [0, bw + gap]) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(pbx + ox, pby, bw, bh);
                ctx.strokeStyle = TEXT_COL;
                ctx.lineWidth = 2.2;
                ctx.strokeRect(pbx + ox, pby, bw, bh);
            }
        }
        endPressTransform(pPress, x, y, size, size);
        const mb = musicBtn;
        let mPress = beginPressTransform(mb.x, mb.y, mb.size, mb.size);
        drawResourceBarBg(mb.x, mb.y, mb.size, mb.size);
        drawOutlinedText(musicEnabled ? '♪' : '♫', mb.x + mb.size / 2, mb.y + mb.size / 2, 'bold 22px Segoe UI, Arial', 'center');
        if (!musicEnabled) {
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(mb.x + 10, mb.y + mb.size - 10);
            ctx.lineTo(mb.x + mb.size - 10, mb.y + 10);
            ctx.stroke();
        }
        endPressTransform(mPress, mb.x, mb.y, mb.size, mb.size);
    }
}

function handleTitleClick(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = WIDTH / rect.width;
    const scaleY = HEIGHT / rect.height;
    const mx = (clientX - rect.left) * scaleX;
    const my = (clientY - rect.top) * scaleY;
    
    // 1. Магазин духов
    if (spiritShopOpen) {
        const cl = titleLayout._spiritShopClose;
        if (cl && mx >= cl.x && mx <= cl.x + cl.w && my >= cl.y && my <= cl.y + cl.h) {
            pressBtn(cl.x, cl.y, cl.w, cl.h);
            spiritShopOpen = false;
            return;
        }
        for (const h of spiritShopHits) {
            if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
                pressBtn(h.x, h.y, h.w, h.h);
                if (h.type === 'buy') {
                    if (totalRolls >= SPIRIT_PRICE) {
                        totalRolls -= SPIRIT_PRICE;
                        unlockedSpirits[h.idx] = true;
                        saveProgress();
                        playCoinSound();
                    } else { coinShake = 20; }
                } else if (h.type === 'select') {
                    selectedSpirit = h.idx;
                    saveProgress();
                }
                return;
            }
        }
        return;
    }

    // 2. Меню уровней / заданий / настроек
    if (titleMenu) {
        const cl = titleLayout._menuClose;
        if (cl && mx >= cl.x && mx <= cl.x + cl.w && my >= cl.y && my <= cl.y + cl.h) {
            pressBtn(cl.x, cl.y, cl.w, cl.h);
            titleMenu = null;
            return;
        }
        for (const h of (titleLayout._menuHits || [])) {
            if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
                pressBtn(h.x, h.y, h.w, h.h);
                if (h.type === 'level' && isLevelUnlocked(h.n)) {
                    if (levelDidScroll) { levelDidScroll = false; return; }
                    const n = h.n;
                    pendingUiAction = () => {
                        currentLevel = n;
                        levelTarget = getLevelTarget(n);
                        titleMenu = null;
                        if (!unlockedChars[selectedCharacter]) selectedCharacter = 0;
                        startGame();
                    };
                    return;
                }
                if (h.type === 'misPrev' && missionPage > 0) missionPage--;
                if (h.type === 'misNext' && (missionPage + 1) * 6 < MISSIONS.length) missionPage++;
                if (h.type === 'claim' && !missionsDone[h.id]) {
                    if (missionDidScroll) { missionDidScroll = false; return; }
                    missionsDone[h.id] = true;
                    totalCoins += h.reward;
                    totalRolls += 1000;
                    saveProgress();
                    saveMetaProgress();
                    secretFlashTimer = 60;
                    secretFlashText = '+1000💎';
                    coinShake = 12;
                }
                if (h.type === 'claimAll') {
                    let sum = 0; let cnt = 0;
                    for (const m of MISSIONS) {
                        if (missionsDone[m.id]) continue;
                        if (getMissionProgress(m) >= m.need) { missionsDone[m.id] = true; sum += m.reward; cnt++; }
                    }
                    if (cnt > 0) {
                        totalCoins += sum;
                        totalRolls += cnt * 1000;
                        saveProgress();
                        saveMetaProgress();
                        secretFlashTimer = 70;
                        secretFlashText = '+' + (cnt * 1000);
                        coinShake = 14;
                    }
                }
                if (h.type === 'togMusic') toggleMusic();
                if (h.type === 'togSfx') { sfxEnabled = !sfxEnabled; saveMetaProgress(); }
                if (h.type === 'slMusic') { musicVol = Math.max(0, Math.min(1, (mx - h.x) / h.w)); music.volume = musicVol; saveMetaProgress(); }
                if (h.type === 'slSfx') { sfxVol = Math.max(0, Math.min(1, (mx - h.x) / h.w)); saveMetaProgress(); }
                return;
            }
        }
        return;
    }

    // 3. Окно инфо персонажа
    if (charInfoPopup >= 0) {
        const up = titleLayout._infoUpgrade;
        if (up && mx >= up.x && mx <= up.x + up.w && my >= up.y && my <= up.y + up.h) {
            pressBtn(up.x, up.y, up.w, up.h);
            upgradeCharacter(up.i);
            return;
        }
        const rst = titleLayout._infoReset;
        if (rst && mx >= rst.x && mx <= rst.x + rst.w && my >= rst.y && my <= rst.y + rst.h) {
            pressBtn(rst.x, rst.y, rst.w, rst.h);
            resetCharacterLevel(rst.i);
            return;
        }
        const cl = titleLayout._infoClose;
        const panel = titleLayout._infoPanel;
        if (cl && mx >= cl.x && mx <= cl.x + cl.w && my >= cl.y && my <= cl.y + cl.h) {
            charInfoPopup = -1;
            return;
        }
        if (panel && !(mx >= panel.x && mx <= panel.x + panel.w && my >= panel.y && my <= panel.y + panel.h)) {
            charInfoPopup = -1;
            return;
        }
        return;
    }

    // 4. Кнопка духов на главном экране
    if (titleLayout._spiritBtn) {
        const b = titleLayout._spiritBtn;
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            spiritShopOpen = true;
            pressBtn(b.x, b.y, b.w, b.h);
            return;
        }
    }

    // 5. 4 кнопки меню
    if (titleLayout._menuBtns) {
        for (const b of titleLayout._menuBtns) {
            if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
                pressBtn(b.x, b.y, b.w, b.h);
                const key = b.key;
                pendingUiAction = () => {
                    if (key === 'start') {
                        currentLevel = 0;
                        levelTarget = 0;
                        if (!unlockedChars[selectedCharacter]) selectedCharacter = 0;
                        startGame();
                    } else if (key === 'levels') {
                        titleMenu = 'levels';
                        levelScrollY = 0;
                        levelScrollV = 0;
                    } else if (key === 'missions') {
                        titleMenu = 'missions';
                        missionScrollY = 0;
                        missionScrollV = 0;
                    } else if (key === 'settings') {
                        titleMenu = 'settings';
                    }
                };
                return;
            }
        }
    }

    // 6. Кнопки «!» у персонажей
    for (const b of titleInfoBtns) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            pressBtn(b.x, b.y, b.w, b.h);
            charInfoPopup = b.i;
            return;
        }
    }

    // 7. Кнопка купить (только coin-unlock)
    if (titleLayout._buyBtns) {
        for (const b of titleLayout._buyBtns) {
            if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
                pressBtn(b.x, b.y, b.w, b.h);
                const info = CHAR_INFO[b.i];
                if (!isCharUnlocked(b.i) && info.unlock === 'coins') {
                    if (totalCoins >= info.price) {
                        totalCoins -= info.price;
                        unlockedChars[b.i] = true;
                        selectedCharacter = b.i;
                        saveProgress();
                    } else {
                        triggerNoMoneyShake(b.i);
                    }
                }
                return;
            }
        }
    }

    // 8. Клик по персонажам (только открытых)
    const positions = getCharPositions();
    for (let i = 0; i < 6; i++) {
        const x = positions[i].x;
        const y = positions[i].y;
        const size = titleLayout.charSize;
        if (mx >= x - 8 && mx <= x + size + 8 && my >= y - 8 && my <= y + size + 8) {
            if (i === 0) {
                firstCharTapCount++;
                secondCharTapCount = 0;
                thirdCharTapCount = 0;
                fourthCharTapCount = 0;
                sixthCharTapCount = 0;
                if (firstCharTapCount >= 25) {
                    for (let j = 0; j < 6; j++) unlockedChars[j] = true;
                    saveProgress();
                    firstCharTapCount = 0;
                    secretFlashTimer = 90;
                    secretFlashText = 'ALL';
                    coinShake = 18;
                }
            } else if (i === 1) {
                secondCharTapCount++;
                firstCharTapCount = 0;
                thirdCharTapCount = 0;
                fourthCharTapCount = 0;
                sixthCharTapCount = 0;
                if (secondCharTapCount >= 25) {
                    maxLevelUnlocked = 100;
                    saveMetaProgress();
                    secondCharTapCount = 0;
                    secretFlashTimer = 90;
                    secretFlashText = 'LV100';
                    coinShake = 18;
                }
            } else if (i === 2) {
                thirdCharTapCount++;
                firstCharTapCount = 0;
                secondCharTapCount = 0;
                fourthCharTapCount = 0;
                sixthCharTapCount = 0;
                if (thirdCharTapCount >= 25) {
                    let coinsKeep = 0;
                    let crystalsKeep = 0;
                    try {
                        for (const k in levelsCompleted) {
                            if (levelsCompleted[k]) {
                                const n = parseInt(k, 10);
                                if (n > 0) {
                                    coinsKeep += 50 + n;
                                    crystalsKeep += 5000;
                                }
                            }
                        }
                    } catch (e) {}
                    try {
                        for (const m of MISSIONS) {
                            if (missionsDone[m.id]) coinsKeep += (m.reward || 0);
                        }
                    } catch (e) {}
                    totalCoins = coinsKeep;
                    totalCrystals = crystalsKeep;
                    unlockedChars = [true, false, false, false, false, false];
                    charLevels = [1, 1, 1, 1, 1, 1];
                    selectedCharacter = 0;
                    saveProgress();
                    saveMetaProgress();
                    thirdCharTapCount = 0;
                    secretFlashTimer = 90;
                    secretFlashText = 'RST';
                    coinShake = 18;
                }
            } else if (i === 3) {
                fourthCharTapCount++;
                firstCharTapCount = 0;
                secondCharTapCount = 0;
                thirdCharTapCount = 0;
                sixthCharTapCount = 0;
                if (fourthCharTapCount >= 25) {
                    totalCoins += 1000000;
                    saveProgress();
                    fourthCharTapCount = 0;
                    secretFlashTimer = 90;
                    secretFlashText = '+1M';
                    coinShake = 18;
                }
            } else if (i === 5) {
                sixthCharTapCount++;
                firstCharTapCount = 0;
                secondCharTapCount = 0;
                thirdCharTapCount = 0;
                fourthCharTapCount = 0;
                if (sixthCharTapCount >= 25) {
                    totalCrystals += 1000000;
                    saveProgress();
                    sixthCharTapCount = 0;
                    secretFlashTimer = 90;
                    secretFlashText = '+1M💎';
                    coinShake = 18;
                }
            } else {
                firstCharTapCount = 0;
                secondCharTapCount = 0;
                thirdCharTapCount = 0;
                fourthCharTapCount = 0;
                sixthCharTapCount = 0;
            }
            if (isCharUnlocked(i)) selectedCharacter = i;
            else if (CHAR_INFO[i].unlock === 'coins') triggerNoMoneyShake(i);
            return;
        }
    }
}

function handleGameClick(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = WIDTH / rect.width;
    const scaleY = HEIGHT / rect.height;
    const mx = (clientX - rect.left) * scaleX;
    const my = (clientY - rect.top) * scaleY;
    if (gameState === 'gameover') {
        const m = gameOverMenuBtns.menu;
        const r = gameOverMenuBtns.retry;
        if (m && mx >= m.x && mx <= m.x + m.w && my >= m.y && my <= m.y + m.h) {
            pressBtn(m.x, m.y, m.w, m.h);
            goToMenu();
            return;
        }
        if (r && mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
            pressBtn(r.x, r.y, r.w, r.h);
            retryGame();
            return;
        }
        return;
    }
    if (gameState === 'levelwin') {
        if (levelWinAnim !== 'idle') return;
        const h = levelWinBtns.home;
        const n = levelWinBtns.next;
        if (h && mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
            pressBtn(h.x, h.y, h.w, h.h);
            levelWinPending = 'home';
            levelWinAnim = 'out';
            return;
        }
        if (n && mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h) {
            pressBtn(n.x, n.y, n.w, n.h);
            levelWinPending = 'next';
            levelWinAnim = 'out';
            return;
        }
        return;
    }
    if (gameState === 'playing') {
        if (!isPaused) {
            const hit = (box) => box && mx >= box.x && mx <= box.x + box.w && my >= box.y && my <= box.y + box.h;
            if (hit(shopHit.buy1)) { pressBtn(shopHit.buy1.x, shopHit.buy1.y, shopHit.buy1.w, shopHit.buy1.h); buyBonus(1); return; }
            if (hit(shopHit.buy2)) { pressBtn(shopHit.buy2.x, shopHit.buy2.y, shopHit.buy2.w, shopHit.buy2.h); buyBonus(2); return; }
            if (hit(shopHit.buy3)) { pressBtn(shopHit.buy3.x, shopHit.buy3.y, shopHit.buy3.w, shopHit.buy3.h); buyBonus(3); return; }
            if (hit(shopHit.b1)) { pressBtn(shopHit.b1.x, shopHit.b1.y, shopHit.b1.w, shopHit.b1.h); useBonus1(); return; }
            if (hit(shopHit.b2)) { pressBtn(shopHit.b2.x, shopHit.b2.y, shopHit.b2.w, shopHit.b2.h); useBonus2(); return; }
            if (hit(shopHit.b3)) { pressBtn(shopHit.b3.x, shopHit.b3.y, shopHit.b3.w, shopHit.b3.h); useBonus3(); return; }
        }
        if (isPaused) {
            const c = pauseMenuBtns.continue;
            const m = pauseMenuBtns.menu;
            if (c && mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) {
                pressBtn(c.x, c.y, c.w, c.h);
                isPaused = false;
                keys.left = false;
                keys.right = false;
                return;
            }
            if (m && mx >= m.x && mx <= m.x + m.w && my >= m.y && my <= m.y + m.h) {
                pressBtn(m.x, m.y, m.w, m.h);
                isPaused = false;
                goToMenu();
                return;
            }
            return;
        }
        {
            const { x, y, size } = pauseBtn;
            if (mx >= x && mx <= x + size && my >= y && my <= y + size) {
                pressBtn(x, y, size, size);
                isPaused = !isPaused;
                keys.left = false;
                keys.right = false;
                return;
            }
        }
        {
            const { x, y, size } = musicBtn;
            if (mx >= x && mx <= x + size && my >= y && my <= y + size) {
                pressBtn(x, y, size, size);
                toggleMusic();
                return;
            }
        }
    }
}
canvas.addEventListener('click', e => {
    if (gameState === 'title') {
        handleTitleClick(e.clientX, e.clientY);
    } else if (gameState === 'playing' || gameState === 'levelwin' || gameState === 'gameover') {
        handleGameClick(e.clientX, e.clientY);
    }
});
canvas.addEventListener('touchend', e => {
    if (levelDrag) {
        levelDidScroll = !!levelDrag.moved;
        levelDrag = null;
    }
    if (missionDrag) {
        missionDidScroll = !!missionDrag.moved;
        missionDrag = null;
    }
    if (e.changedTouches.length > 0) {
        const t = e.changedTouches[0];
        if (gameState === 'title') {
            e.preventDefault();
            handleTitleClick(t.clientX, t.clientY);
        } else if (gameState === 'playing' || gameState === 'levelwin' || gameState === 'gameover') {
            e.preventDefault();
            handleGameClick(t.clientX, t.clientY);
        }
    }
    touchX = null;
    touchY = null;
    if (gameState === 'playing') {
        keys.left = false;
        keys.right = false;
        keys.up = false;
        keys.down = false;
    }
}, { passive: false });
window.addEventListener('keydown', e => {
    if ((e.code === 'KeyP' || e.code === 'Escape') && gameState === 'playing') {
        isPaused = !isPaused;
        keys.left = false;
        keys.right = false;
    }
});
const TARGET_FPS = 90;
const FIXED_DT = 1000 / TARGET_FPS;
let lastFrameTime = 0;
let accumulator = 0;
function loop(now) {
    if (!lastFrameTime) lastFrameTime = now;
    let frameTime = now - lastFrameTime;
    lastFrameTime = now;
    if (frameTime > 45) frameTime = 45;
    accumulator += frameTime;
    while (accumulator >= FIXED_DT) {
        if (gameState === 'playing' || gameState === 'dying' || gameState === 'levelwin') {
            update();
        }
        accumulator -= FIXED_DT;
    }
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
